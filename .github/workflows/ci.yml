name: CI

# 非 main 分支只走 PR 门禁（避免每次 push 与 PR 双跑）；main 上用全量 lint 守住主干。
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 凭据与 token 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Secret scan (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          files=$(git diff --name-only "$base"...HEAD 2>/dev/null || true)
          if [ -n "$files" ]; then
            node scripts/check-secrets.mjs --files $files
          fi
      - name: Secret scan (full tree)
        run: node scripts/check-secrets.mjs --all
      - name: Token lint (admin)
        run: node scripts/check-tokens.mjs admin
      - name: Migration README drift check
        run: node scripts/check-migrations-readme.mjs
      - name: Migration README check self-test
        run: npm run check-migrations-readme:test
      - name: Nginx staging auth template test
        run: npm run check-nginx-staging-auth:test

  deploy-scripts:
    name: 部署脚本回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deploy script tests
        run: bash deploy/scripts/tests/run.sh

  backend:
    name: 后端编译 / vet / lint / 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: cd server && go build ./...
      - name: Vet
        run: cd server && go vet ./...
      - name: Lint (new issues only)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server
          args: --new-from-rev=origin/${{ github.base_ref }}
      - name: Lint (full, main)
        if: github.event_name != 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server
          args: ./...
      - name: Unit tests (DB-free packages)
        run: cd server && go test ./internal/app ./internal/config ./internal/middleware ./internal/auth ./internal/testutil/testdb ./internal/handler/http ./pkg/... ./cmd/internal/seedutil ./cmd/setadmin -count=1
      # handler 包的 409/422 映射是平台确认/套餐错误契约的一部分，纯单测、无 DB；
      # 单独 -run 两个契约测试，避免把整包可能依赖 DB 的用例带进 DB-free 步骤。
      - name: Handler error mapping tests
        run: cd server && go test ./internal/handler/http -run 'TestWriteConfirmOrderErrorMapsCreditReason|TestWritePlanErrorSharedAndEntrySpecificMappings' -count=1 -v

  migrate:
    name: 数据库迁移（干净库）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kindergarten_migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CONFIG_PATH: configs/app.ini
      MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/kindergarten_migrate_test?charset=utf8mb4&parseTime=True&loc=Local"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Prepare config
        run: |
          cp server/configs/app.ini.example server/configs/app.ini
          # 模板的 redis 密码是占位符；CI 的 redis service 无鉴权，
          # 不置空会因 AUTH CHANGE_ME 被拒。REDIS_PASSWORD 空值不会覆盖文件，所以改文件。
          sed -i '/^\[redis\]/,/^\[/ s/^password = CHANGE_ME$/password = /' server/configs/app.ini
      - name: goose up (clean DB)
        working-directory: server
        run: go run ./cmd/migrate up
      - name: goose status
        working-directory: server
        run: go run ./cmd/migrate status
      - name: goose up is idempotent
        working-directory: server
        run: go run ./cmd/migrate up
      - name: extendtrials command tests
        working-directory: server
        env:
          EXTENDTRIALS_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/?charset=utf8mb4&parseTime=True&loc=Local"
        run: go test ./cmd/extendtrials -count=1 -timeout 300s
      - name: seedbase (first run)
        working-directory: server
        run: go run ./cmd/seedbase
      - name: Snapshot seed row counts
        working-directory: server
        run: |
          go run ./cmd/dbcheck --query "SELECT (SELECT COUNT(*) FROM sys_dict_types) AS dict_types, (SELECT COUNT(*) FROM sys_dict_items) AS dict_items, (SELECT COUNT(*) FROM diet_food_categories) AS food_categories, (SELECT COUNT(*) FROM diet_dri_age_targets) AS dri_targets" > /tmp/seed-before.txt
          cat /tmp/seed-before.txt
      - name: seedbase (second run is idempotent)
        working-directory: server
        run: go run ./cmd/seedbase
      - name: Seed row counts unchanged
        working-directory: server
        run: |
          go run ./cmd/dbcheck --query "SELECT (SELECT COUNT(*) FROM sys_dict_types) AS dict_types, (SELECT COUNT(*) FROM sys_dict_items) AS dict_items, (SELECT COUNT(*) FROM diet_food_categories) AS food_categories, (SELECT COUNT(*) FROM diet_dri_age_targets) AS dri_targets" > /tmp/seed-after.txt
          diff -u /tmp/seed-before.txt /tmp/seed-after.txt
      - name: Tenant admin provisioning test
        working-directory: server
        run: go test ./cmd/internal/adminprovision -count=1
      - name: Verify schema
        working-directory: server
        run: |
          go run ./cmd/dbcheck user_consents
          go run ./cmd/dbcheck --query "SHOW COLUMNS FROM payments LIKE 'idempotency_key'" | grep -q idempotency_key
          go run ./cmd/dbcheck --query "SHOW COLUMNS FROM commission_ledger LIKE 'reversed_amount_cents'" | grep -q reversed_amount_cents
      # DB-backed 商业/开通测试（订单确认、收款、授权、平台开通）只在有真实库时才有意义。
      # 复用上面已迁移到最新的干净库，不引入第二套流水线。
      # 这里按测试名选取商业域用例：仓库里另有一批历史用例假设开发库存在 kg 4 / class 6
      # 等固定数据，在干净库上会因外键失败；新增商业用例请沿用这些前缀，才能进这道门禁。
      - name: DB-backed commercial tests (race)
        working-directory: server
        timeout-minutes: 30
        run: |
          set -o pipefail
          go test ./internal/repository ./internal/service -race -p 1 -count=1 -timeout 15m -v \
            -run '^(TestBilling|TestPayment|TestOrder|TestEntitlement|TestCommission|TestPlan_|TestPlanTier|TestPlatform|TestSubscription|TestCommercial|TestActiveStudentCount|TestDeriveOrderStatus|TestCancelGuard)' \
            2>&1 | tee "$RUNNER_TEMP/db-tests.log"
      # 这些测试在缺少 configs/app.ini、DSN 或独立测试库时会 t.Skip。跳过等于没有门禁。
      # 只匹配「缺库/缺配置」的具体原因（数据依赖的合法跳过不在此列），
      # 再断言关键商业用例确实执行并通过，防止 -run 选空或改名后门禁静默失效。
      - name: DB-backed tests must not skip
        working-directory: server
        run: |
          if grep -Eq '跳过：找不到 .*configs/app\.ini|跳过：MySQL DSN 为空|跳过：本地无可用 DB 配置|跳过：MySQL 未配置|authharness:' "$RUNNER_TEMP/db-tests.log"; then
            echo "::error::DB-backed 测试因缺少数据库配置被跳过；CI 必须连到 MySQL service。"
            grep -En '跳过：|authharness:' "$RUNNER_TEMP/db-tests.log" || true
            exit 1
          fi
          for name in \
            TestBillingFlow_SnapshotPaymentsAndCancel \
            TestPaymentIntegrity_PositivePaymentCannotExceedAmountDue \
            TestBillingCreditGrant_ZeroPaidConfirmRequiresReason \
            TestDeriveOrderStatus_PayDueAt \
            TestOrderCreate_RejectsPastPayDueAt \
            TestOrderCreate_SameDayPayDueAtAllowed \
            TestOrderCreate_RejectsZeroAmount \
            TestPlan_ZeroPriceCreateRejected \
            TestPlatformOnboard_ReusesExistingParentAccount; do
            if ! grep -q "^--- PASS: $name " "$RUNNER_TEMP/db-tests.log"; then
              echo "::error::关键 DB 用例 $name 未执行或未通过"
              exit 1
            fi
          done
          echo "DB-backed tests ran without config skips."

  authharness:
    name: 认证测试（authharness / MySQL 8）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 测试库名统一用 kindergarten_test：带 test 标记、与 configs/app.ini 的开发库不同名
    # （#207 测试库守卫的约束）；root 账号拥有 CREATE DATABASE，足以支撑测试内建库/派生库。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kindergarten_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # go test 的 cwd 是包目录，相对路径会解析到 internal/testutil/authharness 下；
      # 这里必须用绝对路径，否则 harness 加载配置失败。
      CONFIG_PATH: ${{ github.workspace }}/server/configs/app.ini
      KDG_TEST_REQUIRE_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Prepare config
        run: cp server/configs/app.ini.example server/configs/app.ini
      # 先在同一临时库上跑生产同款 bootstrap，再让 authharness 复用它。
      - name: goose up (temporary DB)
        working-directory: server
        env:
          MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/kindergarten_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: go run ./cmd/migrate up
      - name: seedbase (temporary DB)
        working-directory: server
        env:
          MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/kindergarten_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: go run ./cmd/seedbase
      # 测试步骤刻意不设置 MYSQL_DSN：harness 把配置里的 DSN 视为「开发库」，
      # 指向同名库会被拒绝。这里显式指定 kindergarten_test（含 test 标记、与开发库
      # 不同名），且 KDG_TEST_REQUIRE_MYSQL=1 让缺库/漏配直接失败，绝不允许静默 skip。
      - name: Run authharness (fail closed, no skips)
        working-directory: server
        env:
          KDG_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/kindergarten_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -o pipefail
          go test -json ./internal/testutil/authharness -count=1 -timeout 600s | tee /tmp/authharness.json
          if grep -q '"Action":"skip"' /tmp/authharness.json; then
            echo "::error::authharness 出现 skip：CI 不允许静默跳过（检查 KDG_TEST_MYSQL_DSN 与 MySQL service）"
            grep -E '"Action":"skip"' /tmp/authharness.json | tail -20
            exit 1
          fi
          if ! grep -q '"Action":"pass".*"Test":' /tmp/authharness.json; then
            echo "::error::authharness 没有执行任何测试（覆盖不允许降低）"
            exit 1
          fi
      # testdb 的派生库路径（含 KDG_TEST_REQUIRE_MYSQL 失败关闭）需要真实 MySQL。
      # 与 authharness 共用本 job 的 service。设置 DSN 时唯一按设计 skip 的是
      # 「未设置 DSN 才走配置回退」这个互斥用例；除此之外出现 skip 判失败。
      # 另外单独断言派生库用例确实通过，防止选择器漂移后「零测试」变绿。
      - name: Run testdb derived-database tests (fail closed, no unexpected skips)
        working-directory: server
        env:
          KDG_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/kindergarten_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -o pipefail
          go test -json ./internal/testutil/testdb -count=1 -timeout 300s | tee /tmp/testdb.json
          if ! grep -q '"Action":"pass".*"Test":"TestOpenConnectsToDerivedDatabaseWhenTestDSNSet"' /tmp/testdb.json; then
            echo "::error::testdb 派生库用例未通过（KDG_TEST_MYSQL_DSN 未生效，或 MySQL service 不可用）"
            exit 1
          fi
          unexpected_skips=$(grep '"Action":"skip"' /tmp/testdb.json | grep -v '"Test":"TestOpenFallsBackToConfigWhenTestDSNAbsent"' || true)
          if [ -n "$unexpected_skips" ]; then
            echo "::error::testdb 出现非预期 skip：CI 不允许静默跳过（检查 KDG_TEST_MYSQL_DSN 与 MySQL service）"
            printf '%s\n' "$unexpected_skips" | tail -20
            exit 1
          fi
          if ! grep -q '"Action":"pass".*"Test":' /tmp/testdb.json; then
            echo "::error::testdb 没有执行任何测试（覆盖不允许降低）"
            exit 1
          fi
      # #208 首批 service 数据库测试：认证/园所入口、家长档案、平台服务三个域。
      # 复用本 job 的 MySQL service 与 bootstrap；testdb 在测试内再派生
      # kindergarten_test_<branch|pkg 哈希> 库并执行 goose 迁移，与上面的
      # kindergarten_test 隔离。串行（-p 1）、不重试；skip 与零测试都判失败。
      # 运行时基线见 server/Readme.md「#208 首批 service 测试」。
      - name: Run first service batch (fail closed, no skips)
        working-directory: server
        env:
          KDG_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/kindergarten_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -o pipefail
          go test -json ./internal/service -count=1 -timeout 300s -p 1 \
            -run '^(TestKindergartenStatusService_SuspendedReadsDB|TestKindergartenEntryFieldsDefaultToSharedChannel|TestKindergartenFindByPublicCodeReturnsActiveOnly|TestGeneratePublicCode\w*|TestBackfillPublicCodesFillsMissingOnly|TestSetPublicCodeIfEmpty\w*|TestEntryServiceFindByPublicCode|TestParentClassInfo_\w+|TestParentStudentProfile_\w+|TestParentClassProfile_\w+|TestPlatformService_\w+|TestPlatformOnboard_\w+)$' \
            | tee /tmp/service-batch.json
          if grep -q '"Action":"skip"' /tmp/service-batch.json; then
            echo "::error::service 首批出现 skip：CI 不允许静默跳过（检查 KDG_TEST_MYSQL_DSN 与 MySQL service）"
            grep -E '"Action":"skip"' /tmp/service-batch.json | tail -20
            exit 1
          fi
          if ! grep -q '"Action":"pass".*"Test":' /tmp/service-batch.json; then
            echo "::error::service 首批没有执行任何测试（-run 选择器与测试名漂移？）"
            exit 1
          fi

  admin:
    name: 管理端静态构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install design tokens
        run: cd shared-design-tokens && npm ci && npm run build
      - name: Install and test admin
        run: cd admin && npm ci && npm test
      - name: Build admin
        run: cd admin && npm run generate

  website:
    name: 官网静态构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install design tokens
        run: cd shared-design-tokens && npm ci && npm run build
      - name: Build website
        run: cd website && npm ci && npm run generate
      - name: Test website content checker
        run: cd website && npm test
      - name: Check website content
        run: cd website && npm run check:content

  miniprogram:
    name: 小程序构建 (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [teacher, parent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install design tokens
        run: cd shared-design-tokens && npm ci && npm run build
      - name: Build ${{ matrix.app }}
        run: cd ${{ matrix.app }} && npm ci && npm run build:mp-weixin
      - name: Test ${{ matrix.app }}
        run: cd ${{ matrix.app }} && npm test

  design-sync:
    name: 设计稿同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check tokens / manifest / source lock
        run: node scripts/design-sync.mjs check
      - name: Self-test design-sync
        run: node --test scripts/design-sync.test.mjs
