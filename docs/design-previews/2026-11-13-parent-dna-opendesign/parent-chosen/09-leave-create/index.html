<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新建请假 · 养成星球</title>
  <link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mp-app" data-od-id="leave-create-page">
    <div class="mp-statusbar" aria-hidden="true">
      <span class="statusbar-time">10:20</span>
      <span class="statusbar-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
          <rect x="0" y="7" width="3" height="4" rx="0.8"></rect>
          <rect x="4.6" y="5.2" width="3" height="5.8" rx="0.8"></rect>
          <rect x="9.2" y="3.2" width="3" height="7.8" rx="0.8"></rect>
          <rect x="13.8" y="1" width="3" height="10" rx="0.8"></rect>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" stroke="currentColor" stroke-width="1.2" opacity="0.45"></rect>
          <rect x="2.5" y="2.5" width="18" height="7" rx="1.6" fill="currentColor"></rect>
          <path d="M24 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.45"></path>
        </svg>
      </span>
    </div>

    <main class="mp-main">
      <div class="page-bar" data-od-id="leave-page-bar">
        <button class="back-button" id="backButton" type="button" aria-label="返回" data-od-id="leave-back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <span class="page-bar-title">乐乐 · 小一班</span>
        <span class="page-bar-side" aria-hidden="true"></span>
      </div>

      <h1 class="page-title" data-od-id="leave-title">新建请假</h1>

      <form class="leave-form" id="leaveForm" novalidate data-od-id="leave-form">
        <section class="form-card" aria-label="请假申请">
          <div class="field field--type" data-od-id="leave-type-field">
            <span class="field-label" id="leaveTypeLabel">请假类型</span>
            <div class="segmented" role="radiogroup" aria-labelledby="leaveTypeLabel">
              <input type="radio" id="leaveTypeSick" name="leaveType" value="sick" checked>
              <label for="leaveTypeSick">病假</label>
              <input type="radio" id="leaveTypePersonal" name="leaveType" value="personal">
              <label for="leaveTypePersonal">事假</label>
              <input type="radio" id="leaveTypeOther" name="leaveType" value="other">
              <label for="leaveTypeOther">其他</label>
            </div>
          </div>

          <div class="field field--dates" data-od-id="leave-date-field">
            <span class="field-label" id="leaveDateLabel">请假日期</span>
            <div class="date-grid" role="group" aria-labelledby="leaveDateLabel">
              <div class="date-col">
                <label class="date-input">
                  <span class="date-copy" aria-hidden="true">
                    <span class="date-kicker">开始</span>
                    <span class="date-value" data-date-label="start">11 月 13 日</span>
                  </span>
                  <svg class="date-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"></rect>
                    <path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                  </svg>
                  <input class="date-native" id="startDate" name="startDate" type="date" value="2026-11-13" min="2026-11-12" max="2026-12-12" aria-label="开始日期">
                </label>
              </div>
              <div class="date-col date-col--end" id="endDateCol">
                <label class="date-input">
                  <span class="date-copy" aria-hidden="true">
                    <span class="date-kicker">结束</span>
                    <span class="date-value" data-date-label="end">11 月 13 日</span>
                  </span>
                  <svg class="date-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"></rect>
                    <path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                  </svg>
                  <input class="date-native" id="endDate" name="endDate" type="date" value="2026-11-13" min="2026-11-12" max="2026-12-12" aria-label="结束日期">
                </label>
              </div>
            </div>
            <p class="field-error" id="endDateError" role="alert" hidden>请选择结束日期</p>
            <p class="field-error" id="dateOrderError" role="alert" hidden>结束日期不能早于开始日期</p>
            <p class="field-error" id="dateLimitError" role="alert" hidden>一次请假最多 30 天</p>
          </div>

          <div class="field field--reason" data-od-id="leave-reason-field">
            <label class="field-label" for="leaveReason">请假事由</label>
            <div class="textarea-shell" id="reasonShell">
              <textarea class="reason-input" id="leaveReason" name="reason" rows="3" maxlength="120" placeholder="请简单说明原因，老师会据此照顾孩子"></textarea>
              <span class="char-count" aria-hidden="true"><span id="reasonCount">0</span> / 120</span>
            </div>
            <p class="field-error" id="reasonError" role="alert" hidden>请填写请假事由</p>
          </div>

          <div class="field field--upload" data-od-id="leave-upload-field">
            <button class="upload-row" id="evidenceTrigger" type="button" aria-describedby="evidenceHelp" data-od-id="leave-upload">
              <span class="upload-glyph" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M4.2 8.2h2.5l1.3-2.1h8l1.3 2.1h2.5A1.6 1.6 0 0 1 21.4 9.8v8.1a1.7 1.7 0 0 1-1.7 1.7H4.3a1.7 1.7 0 0 1-1.7-1.7V9.8a1.6 1.6 0 0 1 1.6-1.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                  <circle cx="12" cy="13.5" r="3.4" stroke="currentColor" stroke-width="1.6"></circle>
                </svg>
              </span>
              <span class="upload-copy">
                <span class="upload-title" id="uploadTitle">上传就医凭证（选填）</span>
                <span class="upload-help" id="evidenceHelp">最多 3 张，仅支持图片</span>
              </span>
              <span class="upload-plus" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                </svg>
              </span>
            </button>
            <input id="evidenceInput" type="file" accept="image/*" multiple hidden>
          </div>
        </section>

        <div class="info-strip" role="note" data-od-id="leave-approval-hint">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"></circle>
            <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span>提交后由班级老师审批，通常 4 小时内回复</span>
        </div>

        <button class="primary-action" type="submit" data-od-id="leave-submit">提交申请</button>
      </form>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
