<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秋日远足 · 班级相册</title>
  <link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="mp-app" data-od-id="page-album-detail">

    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-statusbar__time">10:20</span>
      <span class="mp-statusbar__icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <rect x="0" y="7.4" width="3" height="3.6" rx="1" fill="currentColor"/>
          <rect x="4.7" y="5.1" width="3" height="5.9" rx="1" fill="currentColor"/>
          <rect x="9.4" y="2.7" width="3" height="8.3" rx="1" fill="currentColor"/>
          <rect x="14" y="0" width="3" height="11" rx="1" fill="currentColor"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M1.2 4.1a10.2 10.2 0 0 1 13.6 0"/>
          <path d="M3.8 6.8a6.6 6.6 0 0 1 8.4 0"/>
          <path d="M6.4 9.4a3 3 0 0 1 3.2 0"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.6" y="0.6" width="20.8" height="10.8" rx="3" stroke="currentColor" stroke-opacity="0.38"/>
          <rect x="2.2" y="2.2" width="15.6" height="7.6" rx="1.8" fill="currentColor"/>
          <path d="M23.4 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" fill-opacity="0.38"/>
        </svg>
      </span>
    </div>

    <header class="page-bar" data-od-id="page-bar">
      <button type="button" class="back-btn" data-od-id="btn-back" aria-label="返回班级相册">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.5 4.5 8 12l7.5 7.5"/>
        </svg>
      </button>
      <span class="page-bar__title">班级相册</span>
    </header>

    <main class="mp-main">
      <h1 class="album-title" data-od-id="album-title">秋日远足</h1>
      <p class="album-meta" data-od-id="album-meta">32 张照片 · 10 月 24 日</p>

      <p class="album-note" data-od-id="album-note">秋游那天，孩子们在公园里捡了满满一袋<span class="hl">落叶</span>。<br>回园后，每个人挑出最喜欢的一片，<br>贴成了教室后墙上的秋天。</p>

      <ul class="photo-grid" aria-label="秋日远足相册照片" data-od-id="photo-grid">
        <li class="photo photo--sage" data-od-id="photo-01" aria-label="照片 1"></li>
        <li class="photo photo--gold" data-od-id="photo-02" aria-label="照片 2"></li>
        <li class="photo photo--clay" data-od-id="photo-03" aria-label="照片 3"></li>
        <li class="photo photo--blue" data-od-id="photo-04" aria-label="照片 4"></li>
        <li class="photo photo--sage" data-od-id="photo-05" aria-label="照片 5"></li>
        <li class="photo photo--clay" data-od-id="photo-06" aria-label="照片 6"></li>
        <li class="photo photo--pine" data-od-id="photo-07" aria-label="照片 7"></li>
        <li class="photo photo--gold" data-od-id="photo-08" aria-label="照片 8"></li>
        <li class="photo photo--blue" data-od-id="photo-09" aria-label="照片 9"></li>
        <li class="photo photo--sage" data-od-id="photo-10" aria-label="照片 10"></li>
        <li class="photo photo--gold" data-od-id="photo-11" aria-label="照片 11"></li>
        <li class="photo photo--clay" data-od-id="photo-12" aria-label="照片 12"></li>
        <li class="photo photo--blue" data-od-id="photo-13" aria-label="照片 13"></li>
        <li class="photo photo--pine" data-od-id="photo-14" aria-label="照片 14"></li>
        <li class="photo photo--sage" data-od-id="photo-15" aria-label="照片 15"></li>
        <li class="photo photo--gold" data-od-id="photo-16" aria-label="照片 16"></li>
        <li class="photo photo--clay" data-od-id="photo-17" aria-label="照片 17"></li>
        <li class="photo photo--blue" data-od-id="photo-18" aria-label="照片 18"></li>
        <li class="photo photo--sage" data-od-id="photo-19" aria-label="照片 19"></li>
        <li class="photo photo--pine" data-od-id="photo-20" aria-label="照片 20"></li>
        <li class="photo photo--gold" data-od-id="photo-21" aria-label="照片 21"></li>
        <li class="photo photo--clay" data-od-id="photo-22" aria-label="照片 22"></li>
        <li class="photo photo--blue" data-od-id="photo-23" aria-label="照片 23"></li>
        <li class="photo photo--sage" data-od-id="photo-24" aria-label="照片 24"></li>
        <li class="photo photo--gold" data-od-id="photo-25" aria-label="照片 25"></li>
        <li class="photo photo--pine" data-od-id="photo-26" aria-label="照片 26"></li>
        <li class="photo photo--clay" data-od-id="photo-27" aria-label="照片 27"></li>
        <li class="photo photo--blue" data-od-id="photo-28" aria-label="照片 28"></li>
        <li class="photo photo--sage" data-od-id="photo-29" aria-label="照片 29"></li>
        <li class="photo photo--gold" data-od-id="photo-30" aria-label="照片 30"></li>
        <li class="photo photo--clay" data-od-id="photo-31" aria-label="照片 31"></li>
        <li class="photo photo--blue" data-od-id="photo-32" aria-label="照片 32"></li>
      </ul>

      <div class="album-actions" data-od-id="album-actions">
        <button type="button" class="btn btn--secondary" data-od-id="btn-share">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15.4V4.2"/>
            <path d="M8.2 8 12 4.2 15.8 8"/>
            <path d="M5.2 12.4v5.6a2.6 2.6 0 0 0 2.6 2.6h8.4a2.6 2.6 0 0 0 2.6-2.6v-5.6"/>
          </svg>
          <span>分享</span>
        </button>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
