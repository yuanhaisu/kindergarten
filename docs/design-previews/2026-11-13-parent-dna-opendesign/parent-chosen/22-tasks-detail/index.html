<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>任务详情 · 养成星球</title>
<link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="mp-app" data-od-id="parent-task-detail">

  <div class="mp-statusbar" aria-hidden="true">
    <span class="mp-time">10:20</span>
    <span class="mp-status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
        <rect x="0" y="7" width="3" height="4" rx="1" />
        <rect x="4.5" y="5" width="3" height="6" rx="1" />
        <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
        <rect x="13.5" y="0" width="3" height="11" rx="1" />
      </svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M1.5 3.4a10 10 0 0 1 13 0" />
        <path d="M4 5.9a6.4 6.4 0 0 1 8 0" />
        <path d="M6.4 8.3a2.6 2.6 0 0 1 3.2 0" />
        <circle cx="8" cy="10" r="0.7" fill="currentColor" stroke="none" />
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.6" y="0.6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity=".38" stroke-width="1.2" />
        <rect x="2.2" y="2.2" width="15.5" height="7.6" rx="1.8" fill="currentColor" />
        <path d="M23.2 4.1v3.8c.9-.3 1.4-.9 1.4-1.9s-.5-1.6-1.4-1.9Z" fill="currentColor" fill-opacity=".45" />
      </svg>
    </span>
  </div>

  <header class="page-bar" data-od-id="page-bar">
    <button class="back-btn" type="button" id="back-btn" aria-label="返回亲子任务" data-od-id="back-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 5.5 8 12l6.5 6.5" />
      </svg>
    </button>
    <span class="page-bar__title">乐乐 · 小一班</span>
  </header>

  <main class="mp-main" data-od-id="task-detail">
    <header class="task-head" data-od-id="task-header">
      <p class="kicker">
        <span class="kicker__label">亲子任务</span>
        <span class="task-type" id="task-type">完成型</span>
      </p>
      <h1 class="task-head__title" id="task-title" data-od-id="task-title">给家人讲一件<br />今天开心的事</h1>
      <p class="task-lead" id="task-lead">晚饭后问问乐乐今天在幼儿园最开心的事，听他讲完，再请他说说当时的心情。<br /><span class="hl">不用引导答案</span>，他愿意讲就好。</p>
      <p class="task-meta">
        <span id="task-deadline">截止 11 月 22 日</span>
        <span class="task-meta__dot" aria-hidden="true"></span>
        <span id="task-teacher">王老师</span>
      </p>
    </header>

    <section class="card light-state-card" id="state-card" data-od-id="task-state-card">
      <div class="light-state" id="state-done">
        <span class="state-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
        </span>
        <h2 class="state-title">已记录</h2>
        <p class="state-copy" id="done-copy">今天 19:20 · 老师会在群里看到</p>
        <p class="state-note">不需要上传照片或视频。</p>
      </div>

      <div class="light-state" id="state-pending" hidden>
        <h2 class="state-title">今天完成了吗？</h2>
        <p class="state-copy">完成后点一下即可，不需要上传照片。</p>
        <button class="btn-primary" type="button" id="complete-btn" data-od-id="complete-btn">完成了</button>
        <p class="state-note">也可以直接在群里回复老师。</p>
      </div>

      <div class="light-state" id="state-unbound" hidden>
        <h2 class="state-title">先绑定孩子</h2>
        <p class="state-copy">绑定后才能记录任务完成情况。</p>
        <a class="btn-primary" href="../03-bind/index.html" data-od-id="bind-child">绑定孩子</a>
        <p class="state-note">不是本园家长？<a href="#" id="enroll-link">了解入园</a></p>
      </div>
    </section>

    <section class="resource-card" id="resource-card" data-od-id="task-resource-card" hidden>
      <div class="resource-cover" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7.5v9l8-4.5-8-4.5Z"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <p class="resource-overline">观看型任务</p>
      <h2 class="resource-title">秋天为什么落叶</h2>
      <p class="resource-meta">02:30 · 看完后自动记录</p>
      <button class="btn-primary" type="button" id="resource-btn" data-od-id="resource-btn">查看资源</button>
      <div class="resource-progress" aria-hidden="true"><span class="resource-progress-fill" id="resource-progress"></span></div>
    </section>

    <p class="light-footnote" id="light-footnote">完成记录只用于班级统计。</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>
<script src="app.js"></script>
</body>
</html>
