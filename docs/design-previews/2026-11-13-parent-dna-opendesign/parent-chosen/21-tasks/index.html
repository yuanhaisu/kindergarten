<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>亲子任务 — 养成星球</title>
<link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="mp-app" id="app" data-variant="points" data-od-id="tasks-page">

  <div class="mp-statusbar" aria-hidden="true" data-od-id="status-bar">
    <span class="statusbar-time">10:20</span>
    <span class="statusbar-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1.3 3.7a9.2 9.2 0 0 1 12.4 0"/><path d="M4 6.4a5.4 5.4 0 0 1 7 0"/><path d="M6.6 9.1a1.7 1.7 0 0 1 1.8 0"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="19.5" height="11" rx="3.5" stroke="currentColor" opacity="0.35"/><rect x="2.4" y="2.4" width="13" height="7.2" rx="2" fill="currentColor"/><path d="M22 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" opacity="0.45"/></svg>
    </span>
  </div>

  <header class="page-bar" data-od-id="page-bar">
    <button class="back-btn" id="back-btn" type="button" aria-label="返回" data-od-id="back-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>
    </button>
    <span class="page-bar__title">乐乐 · 小一班</span>
    <span class="page-bar__spacer" aria-hidden="true"></span>
  </header>

    <main class="mp-main" data-od-id="tasks-main">
    <div class="page-head">
      <h1 class="page-title" data-od-id="tasks-title">亲子任务</h1>
      <p class="head-sub">老师发布后，会出现在<span class="hl">这里</span></p>
    </div>

    <section class="today-card" data-od-id="today-card">
      <p class="today-overline">今天 · 11 月 20 日</p>
      <h2 class="today-title" data-od-id="today-task-title">给家人讲一件今天开心的事</h2>
      <p class="today-desc">晚饭后问问乐乐今天在幼儿园最开心的事，听他讲完，再请他说说当时的心情。</p>
      <p class="today-meta">王老师 · 截止 11 月 22 日</p>
      <div class="today-divider" aria-hidden="true"></div>
      <div class="today-foot">
        <span class="tag tag--done">已记录</span>
        <a class="light-link" href="../22-tasks-detail/index.html" data-od-id="today-open">看看</a>
      </div>
    </section>

    <section class="task-section" aria-labelledby="task-list-title" data-od-id="task-section">
      <div class="section-head">
        <h2 class="section-title" id="task-list-title">任务清单</h2>
        <span class="section-count">2 项</span>
      </div>

      <div class="task-card" data-od-id="task-list">
        <a class="task-row" href="../22-tasks-detail/index.html?state=view" data-od-id="task-view">
          <span class="task-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z"/></svg>
          </span>
          <span class="task-body">
            <span class="task-line"><span class="task-title">一起看秋天落叶</span><span class="tag tag--pending">待完成</span></span>
            <span class="task-meta"><span>观看型 · 截止 11 月 24 日</span><span>约 2 分钟</span></span>
          </span>
          <svg class="task-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>

        <a class="task-row" href="../22-tasks-detail/index.html?state=pending" data-od-id="task-action">
          <span class="task-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h9M5 17h6"/><path d="m16 16 1.6 1.6L21 14"/></svg>
          </span>
          <span class="task-body">
            <span class="task-line"><span class="task-title">睡前整理书包</span><span class="tag tag--pending">待完成</span></span>
            <span class="task-meta"><span>完成型 · 截止 11 月 21 日</span><span>每天</span></span>
          </span>
          <svg class="task-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <p class="light-note">任务会通过班级群分享；也可以直接在这里打开。</p>

    <section class="view-empty" id="view-empty" hidden aria-label="暂无亲子任务" data-od-id="empty-state">
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none">
          <path d="M31 62.5 49.5 81 88.5 35" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M95 21v11M89.5 26.5h11" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>
      <h2 class="empty-title">还没有亲子任务</h2>
      <p class="empty-desc">老师发布后，会出现在这里。</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
<script src="../../_shared/nav.js"></script></body>
</html>
