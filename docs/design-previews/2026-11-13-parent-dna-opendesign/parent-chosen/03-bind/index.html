<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>绑定孩子 · 养成星球</title>
  <link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mp-app" data-od-id="bind-app">

    <div class="statusbar" aria-hidden="true" data-od-id="status-bar">
      <span class="statusbar__time">10:20</span>
      <span class="statusbar__icons">
        <svg class="status-icon" viewBox="0 0 18 12" width="18" height="12" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="3" height="4" rx="1"></rect>
          <rect x="5" y="6" width="3" height="6" rx="1"></rect>
          <rect x="10" y="3.5" width="3" height="8.5" rx="1"></rect>
          <rect x="15" y="1" width="3" height="11" rx="1"></rect>
        </svg>
        <svg class="status-icon" viewBox="0 0 16 12" width="16" height="12" aria-hidden="true">
          <path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.4 6.7a7 7 0 0 1 9.2 0M5.9 9.2a3.4 3.4 0 0 1 4.2 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
          <circle cx="8" cy="10.7" r="1" fill="currentColor"></circle>
        </svg>
        <svg class="status-icon" viewBox="0 0 26 12" width="26" height="12" aria-hidden="true">
          <rect x="1" y="1" width="21" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.38"></rect>
          <rect x="3" y="3" width="16" height="6" rx="1.6" fill="currentColor"></rect>
          <path d="M23.6 4.4v3.2c1-.3 1.5-.9 1.5-1.6s-.5-1.3-1.5-1.6Z" fill="currentColor" opacity="0.38"></path>
        </svg>
      </span>
    </div>

    <header class="page-bar" data-od-id="page-bar">
      <button class="page-bar__back" type="button" aria-label="返回" data-od-id="back-button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
          <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <span class="page-bar__title" data-od-id="page-title">绑定孩子</span>
      <span class="page-bar__slot" aria-hidden="true"></span>
    </header>

    <main class="mp-main">
      <section class="bind-head">
        <h1 class="bind-title" data-od-id="bind-title">找到你的孩子</h1>
        <svg class="bind-art" viewBox="0 0 120 120" width="92" height="92" fill="none" aria-hidden="true" focusable="false">
          <circle class="art-disc" cx="60" cy="60" r="48"></circle>
          <circle class="art-ring art-ring--terracotta" cx="50" cy="62" r="20"></circle>
          <circle class="art-ring art-ring--pine" cx="70" cy="62" r="20"></circle>
          <path class="art-leaf" d="M22 34C22 22 32 14 45 16 44 27 36 35 22 34Z"></path>
          <path class="art-leaf-vein" d="M25 32C30 27 35 23 41 19"></path>
          <circle class="art-dot" cx="88" cy="38" r="5.5"></circle>
        </svg>
      </section>

      <p class="bind-intro" id="bind-intro" data-od-id="bind-intro">绑定码由班级老师在入园时提供，共 6–20 位字母数字。绑定后，孩子的通知、成长与接送都会出现在这里。</p>

      <form class="bind-form" id="bind-form" novalidate data-od-id="bind-form">

        <div class="bind-alert" id="bind-alert" role="alert" hidden data-od-id="bind-alert">
          <p class="bind-alert__title">绑定码无效或已过期</p>
          <p class="bind-alert__body">请向班级老师确认绑定码，或换一个绑定码重试。</p>
          <button class="bind-alert__retry" id="bind-retry" type="button" data-od-id="bind-retry">重新输入</button>
        </div>

        <div class="field" data-od-id="field-bind-code">
          <label class="field__label" for="bind-code">绑定码</label>
          <input class="field__input field__input--code" id="bind-code" name="bindCode" type="text" value="ABC12345" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-describedby="bind-code-hint bind-code-error" data-od-id="input-bind-code">
          <p class="field__hint" id="bind-code-hint">6–20 位字母数字</p>
          <p class="field__error" id="bind-code-error" role="alert" hidden>请输入 6–20 位字母数字绑定码</p>
        </div>

        <div class="form-actions">
          <button class="btn-primary" type="submit" data-od-id="bind-submit">绑定孩子</button>
          <button class="btn-text" type="button" data-od-id="contact-teacher">
            <span class="btn-text__muted">没有绑定码？</span>
            <span class="btn-text__action">联系园所老师</span>
          </button>
        </div>
      </form>

      <!-- ?state=success：模拟 POST /parent/students/bind 的成功响应，
           姓名/班级/关系由服务端返回；relation=other 展示为「其他」。 -->
      <section class="bind-success" id="bind-success" hidden data-od-id="bind-success">
        <p class="bind-success__eyebrow" data-od-id="bind-success-title">绑定成功</p>
        <h2 class="bind-success__name" id="success-name">乐乐</h2>
        <dl class="bind-success__meta">
          <div class="bind-success__row">
            <dt>班级</dt>
            <dd id="success-class">小一班</dd>
          </div>
          <div class="bind-success__row">
            <dt>关系</dt>
            <dd id="success-relation">其他</dd>
          </div>
        </dl>
        <p class="bind-success__note">孩子的通知、成长记录与接送信息已经出现在首页。</p>
        <button class="btn-primary" id="success-enter" type="button" data-od-id="bind-enter">进入首页</button>
      </section>

      <footer class="bind-footer">
        <aside class="privacy-note" data-od-id="privacy-note">
          <svg class="privacy-note__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"></circle>
            <path d="M12 11v5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            <circle cx="12" cy="7.8" r="1.1" fill="currentColor"></circle>
          </svg>
          <p>孩子信息只用于家园沟通，不会对外公开。</p>
        </aside>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  </div>
  <script src="app.js" defer></script>
<script src="../../_shared/nav.js"></script></body>
</html>
