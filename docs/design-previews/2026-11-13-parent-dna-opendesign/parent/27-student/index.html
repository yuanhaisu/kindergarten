<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>幼儿信息 · 养成星球</title>
  <link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mp-app" data-od-id="student-page">
    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <header class="mp-pagebar">
      <button class="pagebar-back" type="button" aria-label="返回" data-action="back" data-od-id="btn-back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <span class="pagebar-title">幼儿信息</span>
      <button class="pagebar-edit" type="button" data-action="edit" data-od-id="btn-edit">编辑</button>
    </header>

    <main class="mp-main">
      <section class="profile-head" aria-labelledby="child-name" data-od-id="profile-head">
        <div class="child-avatar" aria-hidden="true">乐</div>
        <div class="profile-copy">
          <h1 class="child-name" id="child-name" data-od-id="child-name">乐乐</h1>
          <p class="child-line">小一班 · <span class="hl">5 岁 2 个月</span></p>
          <p class="child-meta">2025 年 9 月入园</p>
        </div>
      </section>

      <section class="section" aria-labelledby="basic-heading" data-od-id="section-basic-info">
        <h2 class="section-title" id="basic-heading">基本信息</h2>
        <div class="card" data-od-id="basic-info-card">
          <dl class="fact-grid">
            <div class="fact" data-od-id="fact-name">
              <dt class="fact-label">姓名</dt>
              <dd class="fact-value">乐乐</dd>
            </div>
            <div class="fact" data-od-id="fact-gender">
              <dt class="fact-label">性别</dt>
              <dd class="fact-value">女</dd>
            </div>
            <div class="fact" data-od-id="fact-birthday">
              <dt class="fact-label">生日</dt>
              <dd class="fact-value">2021 年 9 月 8 日</dd>
            </div>
            <div class="fact" data-od-id="fact-ethnicity">
              <dt class="fact-label">民族</dt>
              <dd class="fact-value">汉族</dd>
            </div>
            <div class="fact fact--full" data-od-id="fact-household">
              <dt class="fact-label">户籍</dt>
              <dd class="fact-value">湖南 · 湘潭</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="section" aria-labelledby="health-heading" data-od-id="section-health">
        <h2 class="section-title" id="health-heading">健康信息</h2>
        <div class="card" data-od-id="health-card">
          <dl class="fact-grid">
            <div class="fact" data-od-id="fact-height">
              <dt class="fact-label">身高</dt>
              <dd class="fact-value fact-value--num">108<span class="fact-unit">cm</span></dd>
            </div>
            <div class="fact" data-od-id="fact-weight">
              <dt class="fact-label">体重</dt>
              <dd class="fact-value fact-value--num">18<span class="fact-unit">kg</span></dd>
            </div>
            <div class="fact" data-od-id="fact-allergy">
              <dt class="fact-label">过敏史</dt>
              <dd class="fact-value">无</dd>
            </div>
            <div class="fact" data-od-id="fact-care">
              <dt class="fact-label">特殊照护</dt>
              <dd class="fact-value">无</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="section" aria-labelledby="emergency-heading" data-od-id="section-emergency">
        <h2 class="section-title" id="emergency-heading">紧急联系人</h2>
        <div class="card card--contacts" data-od-id="emergency-card">
          <ul class="contact-list">
            <li class="contact" data-od-id="contact-mother">
              <span class="contact-avatar contact-avatar--sage" aria-hidden="true">妈</span>
              <div class="contact-copy">
                <p class="contact-name">妈妈 · 李静</p>
                <p class="contact-phone">138****6721</p>
              </div>
              <button class="call-btn" type="button" aria-label="拨打妈妈李静的电话 138****6721" data-call="妈妈 · 李静" data-od-id="btn-call-mother">
                <span class="call-face">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h3.1l1.5 3.8-2 1.4a12.8 12.8 0 0 0 6.1 6.1l1.4-2 3.8 1.5v3.1a2.4 2.4 0 0 1-2.6 2.4C10.2 19.2 4.8 13.8 4.2 6.1a2.4 2.4 0 0 1 2.4-2.6Z"/></svg>
                </span>
              </button>
            </li>
            <li class="contact" data-od-id="contact-father">
              <span class="contact-avatar contact-avatar--terra" aria-hidden="true">爸</span>
              <div class="contact-copy">
                <p class="contact-name">爸爸</p>
                <p class="contact-phone">138****9034</p>
              </div>
              <button class="call-btn" type="button" aria-label="拨打爸爸的电话 138****9034" data-call="爸爸 · 138****9034" data-od-id="btn-call-father">
                <span class="call-face">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h3.1l1.5 3.8-2 1.4a12.8 12.8 0 0 0 6.1 6.1l1.4-2 3.8 1.5v3.1a2.4 2.4 0 0 1-2.6 2.4C10.2 19.2 4.8 13.8 4.2 6.1a2.4 2.4 0 0 1 2.4-2.6Z"/></svg>
                </span>
              </button>
            </li>
          </ul>
        </div>
      </section>

      <p class="info-note" data-od-id="info-note">
        <svg class="info-note-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        <span>信息有误请联系班级老师修改</span>
      </p>
    </main>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
