<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>隐私与协议 · 养成星球</title>
  <link rel="stylesheet" href="../../_shared/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mp-app" data-od-id="consent-screen">

    <div class="mp-statusbar" aria-hidden="true">
      <span class="status-time">9:41</span>
      <span class="status-icons">
        <svg class="status-icon" width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
          <rect x="5" y="6" width="3" height="6" rx="1" fill="currentColor"/>
          <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="currentColor"/>
          <rect x="15" y="1" width="3" height="11" rx="1" fill="currentColor"/>
        </svg>
        <svg class="status-icon" width="17" height="12" viewBox="0 0 17 12" fill="none">
          <path d="M1.8 4.4c3.7-3.4 9.7-3.4 13.4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M5 7.3c2.1-1.9 5.4-1.9 7.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="8.5" cy="10.3" r="1.3" fill="currentColor"/>
        </svg>
        <svg class="status-icon" width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.7" y="0.7" width="20.6" height="10.6" rx="3.2" stroke="currentColor" stroke-width="1.4" opacity="0.38"/>
          <rect x="2.6" y="2.6" width="16.8" height="6.8" rx="1.6" fill="currentColor"/>
          <path d="M23 4.2v3.6c.9-.3 1.4-1 1.4-1.8s-.5-1.5-1.4-1.8Z" fill="currentColor" opacity="0.38"/>
        </svg>
      </span>
    </div>

    <main class="mp-main" data-od-id="consent-content">

      <header class="page-bar">
        <button class="back" type="button" aria-label="返回" data-od-id="consent-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="page-bar__title">隐私与协议</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </header>

      <h1 class="page-title" data-od-id="consent-title">开始之前</h1>

      <p class="lead" data-od-id="consent-lead">在开始之前，有三份约定需要你确认。它们说明我们会怎样使用你和孩子的信息，以及你<span class="hl">随时可以收回</span>哪些授权。</p>

      <section class="consent-card" aria-labelledby="consent-group-title" data-od-id="consent-card">
        <h2 class="sr-only" id="consent-group-title">需要确认的三份约定</h2>

        <label class="consent-row" for="consent-privacy" data-od-id="consent-row-privacy">
          <input class="consent-input" type="checkbox" id="consent-privacy" checked />
          <span class="checkbox" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.4 6.4 4.9 8.9 9.7 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="row-copy">
            <span class="row-title">隐私政策</span>
            <span class="row-sub">我们如何收集、使用与保护你的信息</span>
          </span>
          <svg class="row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </label>

        <label class="consent-row" for="consent-minor" data-od-id="consent-row-minor">
          <input class="consent-input" type="checkbox" id="consent-minor" checked />
          <span class="checkbox" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.4 6.4 4.9 8.9 9.7 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="row-copy">
            <span class="row-title">未成年人个人信息保护规则</span>
            <span class="row-sub">孩子的信息如何被专门保护</span>
          </span>
          <svg class="row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </label>

        <label class="consent-row" for="consent-terms" data-od-id="consent-row-terms">
          <input class="consent-input" type="checkbox" id="consent-terms" checked />
          <span class="checkbox" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.4 6.4 4.9 8.9 9.7 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="row-copy">
            <span class="row-title">用户协议</span>
            <span class="row-sub">使用养成星球服务的约定</span>
          </span>
          <svg class="row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </label>
      </section>

      <div class="actions">
        <button class="btn-primary" id="consent-submit" type="button" data-od-id="consent-submit">同意并继续</button>
        <button class="btn-text" id="consent-decline" type="button" data-od-id="consent-decline">暂不同意</button>
      </div>

      <p class="footnote" data-od-id="consent-footnote">随时可以在「我的 · 隐私与协议」中查看全文或撤回授权。</p>

    </main>

    <div class="toast" id="consent-toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
