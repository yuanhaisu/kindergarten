<!doctype html>

</head>
<body>
  <div class="mp-app">

      <h1 class="page-title">亲子任务</h1>

        <span class="empty__art" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.4" />
            <path d="m8.2 12.3 2.7 2.7 5-5.4" />
          </svg>
        </span>
        <h2 id="empty-title">今天的任务都完成啦</h2>
        <p class="empty__desc">乐乐今天的三项任务都交了，去班级墙看看大家的分享。</p>
        <a class="btn btn--primary" href="../23-tasks-wall/index.html">看看班级墙</a>
