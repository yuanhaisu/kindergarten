<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 亲子任务</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__spacer { width: 36px; }
    .page-title { margin: 2px 0 16px; }

    .today { padding: 18px 20px 20px; }
    .today-desc { margin: 8px 0 0; font-size: 13px; line-height: 1.65; color: rgba(236, 230, 215, 0.78); }
    .today-progress { display: grid; gap: 9px; margin-top: 16px; }
    /* 松绿卡是深底，共享 steps3 的深色实心段在这里不可见，按 token 换成骨白 */
    .today-progress .steps3 i { background: repeating-linear-gradient(90deg, rgba(236, 230, 215, 0.42) 0 7px, transparent 7px 12px); }
    .today-progress .steps3 i.is-on { background: var(--bone); }
    .today-streak { font-size: 11.5px; color: rgba(236, 230, 215, 0.75); }
    .today-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .points { display: flex; align-items: baseline; gap: 5px; color: var(--marigold-soft); }
    .points b { font-size: 20px; }
    .points span { font-size: 11.5px; }

    .filters { display: flex; gap: 8px; margin: 16px 0 4px; }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 8px; }
    .section-head span { font-size: 11px; color: var(--ink-bone); }

    .task-right { display: grid; justify-items: end; gap: 5px; flex: 0 0 auto; }
    .task-point { display: flex; align-items: baseline; gap: 3px; }
    .task-point b { font-size: 15px; color: var(--pine); }
    .task-point span { font-size: 11px; color: var(--ink-card); }

    .wall-link { display: block; margin-top: 14px; text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
        </button>
        <span class="page-bar__title">乐乐 · 小一班</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </header>

      <h1 class="page-title">亲子任务</h1>

      <section class="today card card--pine" aria-labelledby="today-title">
        <p class="overline">今日任务</p>
        <h2 id="today-title">给家人讲一件今天开心的事</h2>
        <p class="today-desc">晚饭后问问乐乐今天在幼儿园最开心的事，听他讲完，再请他说说当时的心情。</p>
        <div class="today-progress">
          <div class="steps3" aria-hidden="true"><i class="is-on"></i><i class="is-on"></i><i></i></div>
          <span class="today-streak">本周 2 / 3 天 · 今天还没打卡</span>
        </div>
        <div class="today-foot">
          <span class="points"><b class="num">+10</b><span>积分</span></span>
          <a class="btn btn--ghost" href="../22-tasks-detail/index.html">去打卡</a>
        </div>
      </section>

      <div class="filters" role="tablist" aria-label="按状态筛选">
        <button class="chip is-on" type="button" aria-pressed="true">待完成</button>
        <button class="chip" type="button" aria-pressed="false">已完成</button>
        <button class="chip" type="button" aria-pressed="false">全部</button>
      </div>

      <section aria-labelledby="list-title">
        <div class="section-head">
          <h2 id="list-title">任务清单</h2>
          <span>共 3 项</span>
        </div>

        <div class="card card--flush">
          <div class="list-row">
            <span class="orb orb--gold" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="7.6" width="14.8" height="12.6" rx="2.4"/><path d="M9 7.6V6.2a3 3 0 0 1 6 0v1.4"/><path d="M9.2 12.4h5.6"/></svg>
            </span>
            <span class="list-row__body">
              <span class="list-row__title">睡前整理书包</span>
              <span class="list-row__sub">每天 · 20:30 前完成</span>
            </span>
            <span class="task-right">
              <span class="task-point"><b class="num">+10</b><span>积分</span></span>
              <span class="tag tag--wait">待完成</span>
            </span>
          </div>

          <div class="list-row">
            <span class="orb orb--clay" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.4h16"/><path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0"/><path d="M9.4 8.2c0-.8.6-1.3.6-2.2"/><path d="M13.4 8.2c0-.8.6-1.3.6-2.2"/></svg>
            </span>
            <span class="list-row__body">
              <span class="list-row__title">帮忙摆碗筷</span>
              <span class="list-row__sub">每天 · 晚饭前完成</span>
            </span>
            <span class="task-right">
              <span class="task-point"><b class="num">+10</b><span>积分</span></span>
              <span class="tag tag--wait">待完成</span>
            </span>
          </div>

          <div class="list-row">
            <span class="orb orb--mint" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 9.6h15.2l-1.2 9a2.4 2.4 0 0 1-2.4 2H8a2.4 2.4 0 0 1-2.4-2Z"/><path d="M8.6 9.6V7.4a3.4 3.4 0 0 1 6.8 0v2.2"/></svg>
            </span>
            <span class="list-row__body">
              <span class="list-row__title">周末一起买菜</span>
              <span class="list-row__sub">本周六 · 和乐乐一起列清单</span>
            </span>
            <span class="task-right">
              <span class="task-point"><b class="num">+15</b><span>积分</span></span>
              <span class="tag tag--wait">待完成</span>
            </span>
          </div>
        </div>
      </section>

      <a class="wall-link card card--flush" href="../23-tasks-wall/index.html">
        <span class="list-row">
          <span class="orb orb--mint" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="3.8" width="7" height="7" rx="1.8"/><rect x="13.2" y="3.8" width="7" height="7" rx="1.8"/><rect x="3.8" y="13.2" width="7" height="7" rx="1.8"/><rect x="13.2" y="13.2" width="7" height="7" rx="1.8"/></svg>
          </span>
          <span class="list-row__body">
            <span class="list-row__title">班级墙</span>
            <span class="list-row__sub">今天 18 位小朋友完成了任务</span>
          </span>
          <span class="chev">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>
          </span>
        </span>
      </a>
    </main>
  </div>
</body>
</html>
