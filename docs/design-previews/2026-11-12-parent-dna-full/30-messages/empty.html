<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 消息空态</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__pad { width: 36px; height: 36px; }
    .page-title { margin: 0 0 14px; }
    .seg { margin-bottom: 4px; }
    .empty { padding-top: 56px; }
    .empty h2 { font-size: 21px; }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
        </button>
        <span class="page-bar__title">消息</span>
        <span class="page-bar__pad" aria-hidden="true"></span>
      </header>

      <h1 class="page-title">消息</h1>

      <div class="seg" role="group" aria-label="消息筛选">
        <button class="is-on" type="button" aria-pressed="true">全部</button>
        <button type="button" aria-pressed="false">系统</button>
        <button type="button" aria-pressed="false">老师</button>
      </div>

      <div class="empty">
        <div class="empty__art" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11.6a7.6 7.6 0 0 1-8 7.6 8.7 8.7 0 0 1-3.2-.6L4 20l1.3-3.6A7.4 7.4 0 0 1 4 11.6 7.6 7.6 0 0 1 12 4a7.6 7.6 0 0 1 8 7.6Z"/>
            <path d="M8.6 11.6h6.8"/>
          </svg>
        </div>
        <h2>暂时没有新消息</h2>
        <p class="empty__desc">老师和园所的消息会出现在这里</p>
        <button class="btn btn--primary" type="button">回到首页</button>
      </div>
    </main>
  </div>
</body>
</html>
