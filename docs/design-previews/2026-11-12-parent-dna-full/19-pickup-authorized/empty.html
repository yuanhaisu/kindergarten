<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 可接送人（空态）</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__spacer { width: 36px; height: 36px; }
    .page-sub { margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-bone); }
    .empty { padding-top: 72px; }
    .empty__art { margin-bottom: 22px; }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回接送">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6 6.5 6 6.5"/></svg>
        </button>
        <span class="page-bar__title">接送</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </header>

      <h1>可接送人</h1>
      <p class="page-sub">只有名单内的家人可以接走孩子</p>

      <section class="empty" aria-label="空态">
        <div class="empty__art" aria-hidden="true">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="34" fill="#FCFAF4" stroke="#173220" stroke-width="2.6"/>
            <circle cx="49" cy="51" r="8" fill="#DDB14A" stroke="#173220" stroke-width="2.4"/>
            <path d="M37 82c0-8.6 5.2-14.6 12-14.6S61 73.4 61 82Z" fill="#8DA386" stroke="#173220" stroke-width="2.4" stroke-linejoin="round"/>
            <circle cx="71" cy="61" r="6" fill="#FCFAF4" stroke="#173220" stroke-width="2.2"/>
            <path d="M62 82c0-6.4 4-10.8 9-10.8s9 4.4 9 10.8Z" fill="#E5BCA1" stroke="#173220" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="86" cy="38" r="4" fill="#C36540"/>
          </svg>
        </div>
        <h2>还没有添加其他接送人</h2>
        <p class="empty__desc">添加后，家人可在园门口凭码接走乐乐。</p>
        <a class="btn btn--primary" href="index.html">添加授权人</a>
      </section>
    </main>
  </div>
</body>
</html>
