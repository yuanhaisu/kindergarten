<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 添加授权人</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__spacer { width: 36px; }
    .page-title { margin: 2px 0 6px; }
    .page-sub { margin: 0 0 14px; font-size: 13px; line-height: 1.55; color: var(--ink-bone); }

    .form-card { display: grid; padding: 12px 18px; gap: 8px; }
    .form-card .hairline { margin: 0; }
    .picker svg { color: var(--ink-soft); }

    .photo-row { display: flex; align-items: center; gap: 12px; }
    .photo-thumb { display: grid; place-items: center; width: 52px; height: 52px; flex: 0 0 auto; color: var(--pine); }
    .photo-title { display: block; font-size: 14px; font-weight: 500; color: var(--pine); }
    .photo-hint { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.45; color: var(--ink-card); }

    .privacy { margin: 10px 0 0; text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--ink-bone); }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回可接送人">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
        </button>
        <span class="page-bar__title">接送</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </header>

      <h1 class="page-title">添加授权人</h1>
      <p class="page-sub">为乐乐（小一班）添加一位可接送人</p>

      <form class="stack" novalidate>
        <section class="card form-card" aria-label="授权人信息">
          <div class="field">
            <label class="field__label" for="person-name">姓名</label>
            <div class="input">
              <input id="person-name" type="text" value="陈秀兰" placeholder="请填写身份证上的姓名" />
            </div>
          </div>

          <hr class="hairline" />

          <div class="field">
            <span class="field__label">与孩子的关系</span>
            <div class="picker">
              <span>外婆</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 9.5 5 5 5-5"/></svg>
            </div>
            <span class="field__hint">可选：爷爷、奶奶、外公、外婆、其他</span>
          </div>

          <hr class="hairline" />

          <div class="field">
            <label class="field__label" for="person-phone">手机号</label>
            <div class="input">
              <input id="person-phone" type="tel" inputmode="tel" value="13700004418" placeholder="用于接收审核结果" />
            </div>
          </div>

          <hr class="hairline" />

          <div class="field">
            <span class="field__label">有效期</span>
            <div class="picker">
              <span>长期授权</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 9.5 5 5 5-5"/></svg>
            </div>
            <span class="field__hint">可指定日期，到期自动失效</span>
          </div>

          <hr class="hairline" />

          <div class="field">
            <span class="field__label">人像照片</span>
            <div class="photo-row">
              <span class="thumb thumb--sage photo-thumb" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.6" r="3.6"/><path d="M4.8 20.4c.7-4 3.6-6.2 7.2-6.2s6.5 2.2 7.2 6.2"/></svg>
              </span>
              <span class="grow">
                <span class="photo-title">已上传 1 张</span>
                <span class="photo-hint">用于老师与门卫在门口核对身份</span>
              </span>
              <button class="btn btn--text btn--sm" type="button">更换</button>
            </div>
          </div>
        </section>

        <div class="banner banner--warning">
          <span class="banner__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3 3.6 16.4a1.7 1.7 0 0 0 1.5 2.5h13.8a1.7 1.7 0 0 0 1.5-2.5L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 16.6h.01"/></svg>
          </span>
          <span>授权人接走孩子时需出示接送码</span>
        </div>

        <button class="btn btn--primary btn--lg btn--block" type="button">提交审核</button>
      </form>

      <p class="privacy">授权信息仅用于接送核验，园所不会对外提供。</p>
    </main>
  </div>
</body>
</html>
