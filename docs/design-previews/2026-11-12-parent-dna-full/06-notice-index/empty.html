<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 通知</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__spacer { width: 36px; height: 36px; }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <div class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
        </button>
        <span class="page-bar__title">乐乐 · 小一班</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </div>

      <h1>通知</h1>

      <section class="empty" aria-labelledby="empty-title">
        <span class="empty__art" aria-hidden="true">
          <svg width="76" height="76" viewBox="0 0 120 120" fill="none">
            <path d="M60 20c-13.8 0-23 9.8-23 23.4V58c0 7.2-3.4 12.4-7.4 15.8h60.8C86.4 70.4 83 65.2 83 58V43.4C83 29.8 73.8 20 60 20Z" fill="#FCFAF4" stroke="#173220" stroke-width="3" stroke-linejoin="round" />
            <path d="M50.5 84.5a9.8 9.8 0 0 0 19 0" stroke="#173220" stroke-width="3" stroke-linecap="round" />
            <circle cx="60" cy="12.5" r="4" fill="#DDB14A" stroke="#173220" stroke-width="2.4" />
            <path d="M30 47c-2.4 3-3.6 6.2-3.6 9.8" stroke="#8DA386" stroke-width="2.6" stroke-linecap="round" />
            <circle cx="94" cy="44" r="2.4" fill="#C36540" />
            <circle cx="27" cy="76" r="1.8" fill="#173220" />
          </svg>
        </span>
        <h2 id="empty-title">还没有通知</h2>
        <p class="empty__desc">园所有新通知时会出现在这里</p>
        <a class="btn btn--primary" href="#">回到首页</a>
      </section>
    </main>
  </div>
</body>
</html>
