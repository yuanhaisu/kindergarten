<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 新建请假</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__spacer { width: 36px; }
    .page-title { margin: 2px 0 16px; }

    .form-card { display: grid; gap: 14px; }
    .form-card .hairline { margin: 0; }

    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .date-field { display: grid; gap: 6px; }
    .date-label { font-size: 11.5px; color: var(--ink-card); }
    .picker svg { color: var(--ink-soft); }
    .picker--error { border-color: var(--danger); }
    .date-value.is-empty { color: var(--ink-card); }

    .input--area textarea { height: 66px; line-height: 1.6; }
    .field-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 16px; }
    .counter { margin-left: auto; font-size: 11.5px; color: var(--ink-card); font-variant-numeric: tabular-nums; }

    .upload {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 1px dashed var(--hair-strong);
      border-radius: var(--r-md);
      background: transparent;
      font-family: var(--sans);
      text-align: left;
      cursor: pointer;
    }
    .upload-title { display: block; font-size: 15px; font-weight: 500; color: var(--pine); }
    .upload-hint { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink-card); }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
        </button>
        <span class="page-bar__title">乐乐 · 小一班</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </header>

      <h1 class="page-title">新建请假</h1>

      <form class="stack" novalidate data-state="default">
        <section class="card form-card" aria-label="请假信息">
          <div class="field">
            <span class="field__label">请假类型</span>
            <div class="seg" role="group" aria-label="请假类型">
              <button class="is-on" type="button" aria-pressed="true">病假</button>
              <button type="button" aria-pressed="false">事假</button>
              <button type="button" aria-pressed="false">其他</button>
            </div>
          </div>

          <hr class="hairline" />

          <div class="field">
            <span class="field__label">请假日期</span>
            <div class="date-row">
              <div class="date-field">
                <span class="date-label">开始</span>
                <div class="picker">
                  <span class="date-value">11 月 12 日</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="5.4" width="16.4" height="14.8" rx="2.6"/><path d="M7.8 3.2v4.2"/><path d="M16.2 3.2v4.2"/><path d="M3.8 10h16.4"/></svg>
                </div>
              </div>
              <div class="date-field">
                <span class="date-label">结束</span>
                <div class="picker" data-error-target="end">
                  <span class="date-value" data-end-value>11 月 12 日</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="5.4" width="16.4" height="14.8" rx="2.6"/><path d="M7.8 3.2v4.2"/><path d="M16.2 3.2v4.2"/><path d="M3.8 10h16.4"/></svg>
                </div>
              </div>
            </div>
            <p class="field__error" data-error-only hidden>请选择结束日期</p>
          </div>

          <hr class="hairline" />

          <div class="field">
            <label class="field__label" for="reason">请假事由</label>
            <div class="input input--area" data-error-target="reason">
              <textarea id="reason" placeholder="请简单说明原因，老师会据此照顾孩子"></textarea>
            </div>
            <div class="field-foot">
              <span class="field__error" data-error-only hidden>请填写请假事由</span>
              <span class="counter">0 / 120</span>
            </div>
          </div>

          <hr class="hairline" />

          <button class="upload" type="button">
            <span class="orb orb--mint" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.6A2.2 2.2 0 0 1 5.8 6.4h1.6l1.1-1.7a1.4 1.4 0 0 1 1.2-.7h4.6a1.4 1.4 0 0 1 1.2.7l1.1 1.7h1.6a2.2 2.2 0 0 1 2.2 2.2v8.2a2.2 2.2 0 0 1-2.2 2.2H5.8a2.2 2.2 0 0 1-2.2-2.2Z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
            </span>
            <span class="grow">
              <span class="upload-title">上传就医凭证（选填）</span>
              <span class="upload-hint">最多 3 张，仅支持图片</span>
            </span>
            <span class="chev" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13"/><path d="M5.5 12h13"/></svg>
            </span>
          </button>
        </section>

        <div class="banner banner--info">
          <span class="banner__icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 10.6v5.2"/><path d="M12 7.6h.01"/></svg>
          </span>
          <span>提交后由班级老师审批，通常 2 小时内回复</span>
        </div>

        <button class="btn btn--primary btn--lg btn--block" type="button">提交申请</button>
      </form>
    </main>
  </div>
  <script>
    // 仅用于设计稿预览：?state=error 展示校验失败态
    const state = new URLSearchParams(location.search).get("state");
    if (state === "error") {
      const form = document.querySelector("form[data-state]");
      if (form) form.dataset.state = "error";
      const errorClass = { reason: "input--error", end: "picker--error" };
      document.querySelectorAll("[data-error-target]").forEach((el) => {
        const cls = errorClass[el.dataset.errorTarget];
        if (cls) el.classList.add(cls);
      });
      document.querySelectorAll("[data-error-only]").forEach((el) => {
        el.hidden = false;
      });
      const end = document.querySelector("[data-end-value]");
      if (end) {
        end.textContent = "请选择";
        end.classList.add("is-empty");
      }
    }
  </script>
</body>
</html>
