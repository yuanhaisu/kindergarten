<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 班级相册 · 空态</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .bar-spacer { width: 36px; height: 36px; }

    .page-head { margin-top: 2px; }
    .empty-wrap { margin-top: 26px; }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回首页">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
        </button>
        <span class="page-bar__title">小一班</span>
        <span class="bar-spacer" aria-hidden="true"></span>
      </header>

      <header class="page-head">
        <h1>班级相册</h1>
      </header>

      <div class="empty-wrap">
        <div class="empty">
          <span class="empty__art" aria-hidden="true">
            <svg width="76" height="76" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect x="26" y="32" width="68" height="58" rx="10" stroke-width="3"/>
              <circle cx="47" cy="51" r="6" fill="#DDB14A" stroke="none"/>
              <path d="M30 79 50 59l13 13 11-9 16 16" stroke-width="2"/>
            </svg>
          </span>
          <h2>还没有相册</h2>
          <p class="empty__desc">老师上传照片后会显示在这里</p>
          <a class="btn btn--primary" href="#">回到首页</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
