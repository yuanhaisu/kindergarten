<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>养成星球 · 家长端 · 班级墙</title>
  <link rel="stylesheet" href="../_shared/dna.css" />
  <style>
    .page-bar__spacer { width: 36px; }
    .page-title { margin: 2px 0 8px; }

    .wall-desc { margin: 0 0 14px; font-size: 13px; line-height: 1.6; color: var(--ink-card); }
    .filters { display: flex; gap: 8px; margin: 0 0 14px; }

    .wall { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .wall-card {
      display: block;
      overflow: hidden;
      border: 1px solid var(--hair);
      border-radius: var(--r-lg);
      background: var(--card);
      text-decoration: none;
      color: inherit;
    }
    .wall-thumb { aspect-ratio: 1 / 1; border: 0; border-bottom: 1px solid var(--hair-soft); border-radius: 0; }
    .wall-body { padding: 10px 12px 12px; }
    .wall-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .wall-name { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--pine); }
    .wall-like { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; font-size: 11px; color: var(--ink-card); }
    .wall-like svg { color: var(--terracotta); }
    .wall-task {
      display: -webkit-box;
      margin: 3px 0 0;
      overflow: hidden;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-card);
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .wall-foot { margin: 16px 0 0; text-align: center; font-size: 11px; line-height: 1.5; color: var(--ink-bone); }
  </style>
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="page-bar">
        <button class="icon-btn icon-btn--plain" type="button" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
        </button>
        <span class="page-bar__title">乐乐 · 小一班</span>
        <span class="page-bar__spacer" aria-hidden="true"></span>
      </header>

      <h1 class="page-title">班级墙</h1>
      <p class="wall-desc">今天有 <span class="hl">18 位小朋友</span>完成了任务</p>

      <div class="filters" role="tablist" aria-label="筛选">
        <button class="chip is-on" type="button" aria-pressed="true">全部</button>
        <button class="chip" type="button" aria-pressed="false">小一班</button>
        <button class="chip" type="button" aria-pressed="false">我的</button>
      </div>

      <div class="wall">
        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--sage" role="img" aria-label="乐乐打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">乐乐</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>12</span></div>
            <p class="wall-task">给家人讲一件今天开心的事</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--gold" role="img" aria-label="豆豆打卡的照片">
            <span class="thumb__badge">老师点赞</span>
          </div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">豆豆</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>9</span></div>
            <p class="wall-task">给家人讲一件今天开心的事</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--clay" role="img" aria-label="朵朵打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">朵朵</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>7</span></div>
            <p class="wall-task">睡前整理书包</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--blue" role="img" aria-label="小宇打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">小宇</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>5</span></div>
            <p class="wall-task">给家人讲一件今天开心的事</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--pine" role="img" aria-label="安然打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">安然</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>4</span></div>
            <p class="wall-task">帮忙摆碗筷</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--sage" role="img" aria-label="辰辰打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">辰辰</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>3</span></div>
            <p class="wall-task">给家人讲一件今天开心的事</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--gold" role="img" aria-label="果果打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">果果</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>2</span></div>
            <p class="wall-task">帮忙摆碗筷</p>
          </div>
        </a>

        <a class="wall-card" href="../22-tasks-detail/index.html">
          <div class="thumb wall-thumb thumb--clay" role="img" aria-label="阳阳打卡的照片"></div>
          <div class="wall-body">
            <div class="wall-top"><span class="wall-name">阳阳</span><span class="wall-like"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.7-4.6-7.7-10A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.7 2.9c0 5.4-7.7 10-7.7 10Z"/></svg>1</span></div>
            <p class="wall-task">睡前整理书包</p>
          </div>
        </a>
      </div>

      <p class="wall-foot">只展示家长公开、老师审核通过的打卡</p>
    </main>
  </div>
</body>
</html>
