<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNA 验证集 · 家长端 5 页</title>
  <style>
    :root {
      --bone: #ece6d7;
      --pine: #173220;
      --ink-soft: #728173;
      --serif: "Instrument Serif", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --sans: Geist, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    body {
      margin: 0;
      padding: 48px 40px 64px;
      background: var(--bone);
      color: var(--pine);
      font-family: var(--sans);
    }
    h1 { margin: 0 0 6px; font-family: var(--serif); font-size: 44px; font-weight: 400; letter-spacing: -1px; }
    p.lead { margin: 0 0 36px; font-size: 15px; color: var(--ink-soft); }
    .grid { display: flex; flex-wrap: wrap; gap: 32px; }
    .item { width: 260px; }
    .frame {
      width: 390px;
      height: 844px;
      transform: scale(0.62);
      transform-origin: top left;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.3);
    }
    .item { height: 540px; }
    iframe { width: 390px; height: 844px; border: 0; }
    a { color: inherit; text-decoration: none; }
    .label { display: block; margin-top: 6px; font-family: var(--serif); font-size: 20px; }
  </style>
</head>
<body>
  <h1>DNA 验证集</h1>
  <p class="lead">Kinderly DNA 应用到家长端 5 个代表性页面 · 2026-11-11 · 仅用于方向验证，未接入门禁</p>
  <div class="grid">
    <a class="item" href="parent/01-home/">
      <span class="frame"><iframe src="parent/01-home/" title="首页" loading="lazy"></iframe></span>
      <span class="label">01 首页</span>
    </a>
    <a class="item" href="parent/02-pickup/">
      <span class="frame"><iframe src="parent/02-pickup/" title="接送" loading="lazy"></iframe></span>
      <span class="label">02 接送</span>
    </a>
    <a class="item" href="parent/03-growth/">
      <span class="frame"><iframe src="parent/03-growth/" title="成长列表" loading="lazy"></iframe></span>
      <span class="label">03 成长列表</span>
    </a>
    <a class="item" href="parent/04-leave-create/">
      <span class="frame"><iframe src="parent/04-leave-create/" title="请假表单" loading="lazy"></iframe></span>
      <span class="label">04 请假表单</span>
    </a>
    <a class="item" href="parent/05-growth-detail/">
      <span class="frame"><iframe src="parent/05-growth-detail/" title="成长详情" loading="lazy"></iframe></span>
      <span class="label">05 成长详情</span>
    </a>
  </div>
</body>
</html>
