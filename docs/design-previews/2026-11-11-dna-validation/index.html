<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNA 验证集 · 家长端 5 页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bone: #ece6d7;
      --pine: #173220;
      --ink-soft: #728173;
      --serif: "Instrument Serif", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --sans: Geist, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 56px 48px 72px;
      background: var(--bone);
      color: var(--pine);
      font-family: var(--sans);
    }
    h1 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 44px;
      font-weight: 400;
      letter-spacing: -1px;
    }
    p.lead { margin: 0 0 40px; font-size: 15px; color: var(--ink-soft); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
      gap: 40px 32px;
      max-width: 1320px;
    }
    .item { display: block; color: inherit; text-decoration: none; }
    .frame {
      display: block;
      width: 100%;
      aspect-ratio: 390 / 844;
      overflow: hidden;
      border-radius: 40px;
      background: #ded6c6;
      box-shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.3);
      transition: transform 0.25s ease;
    }
    .item:hover .frame { transform: translateY(-3px); }
    .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .label {
      display: block;
      margin-top: 12px;
      font-family: var(--serif);
      font-size: 21px;
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>
  <h1>DNA 验证集</h1>
  <p class="lead">Kinderly DNA 应用到家长端 5 个代表性页面 · 2026-11-11 · 仅用于方向验证，未接入门禁</p>
  <div class="grid">
    <a class="item" href="parent/01-home/index.html">
      <span class="frame"><img src="parent/01-home/preview.png" alt="首页预览" /></span>
      <span class="label">01 首页</span>
    </a>
    <a class="item" href="parent/02-pickup/index.html">
      <span class="frame"><img src="parent/02-pickup/preview.png" alt="接送预览" /></span>
      <span class="label">02 接送</span>
    </a>
    <a class="item" href="parent/03-growth/index.html">
      <span class="frame"><img src="parent/03-growth/preview.png" alt="成长列表预览" /></span>
      <span class="label">03 成长列表</span>
    </a>
    <a class="item" href="parent/04-leave-create/index.html">
      <span class="frame"><img src="parent/04-leave-create/preview.png" alt="请假表单预览" /></span>
      <span class="label">04 请假表单</span>
    </a>
    <a class="item" href="parent/05-growth-detail/index.html">
      <span class="frame"><img src="parent/05-growth-detail/preview.png" alt="成长详情预览" /></span>
      <span class="label">05 成长详情</span>
    </a>
  </div>
</body>
</html>
