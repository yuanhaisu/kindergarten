<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>养成星球 · 接送 · DNA 验证</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../_shared/dna.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mp-app">
    <div class="mp-statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <main class="mp-main">
      <header class="screen-head">
        <div>
          <p class="overline">乐乐 · 小一班</p>
          <h1>接送</h1>
        </div>
        <button class="btn btn--ghost btn--sm" type="button">接送码</button>
      </header>

      <section class="pass card" aria-labelledby="pass-title">
        <div class="pass-top">
          <div>
            <p class="overline">今天</p>
            <h2 id="pass-title" class="pass-state">在园中</h2>
            <p class="pass-sub">乐乐已入园，等下午来接</p>
          </div>
          <span class="pass-orb" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/></svg>
          </span>
        </div>

        <ol class="rail">
          <li class="rail-step is-done">
            <span class="rail-dot" aria-hidden="true"></span>
            <div class="rail-body">
              <b>送入</b>
              <span>07:52 · 妈妈</span>
            </div>
          </li>
          <li class="rail-step">
            <span class="rail-dot" aria-hidden="true"></span>
            <div class="rail-body">
              <b>接走</b>
              <span class="muted">等待接走</span>
            </div>
          </li>
        </ol>

        <div class="rail-line" aria-hidden="true"><span></span></div>
      </section>

      <section class="qr-card card card--soft" aria-labelledby="qr-title">
        <div>
          <h2 id="qr-title">到园时出示接送码</h2>
          <p class="muted qr-note">老师扫码核验后，接走记录会自动写入。</p>
        </div>
        <button class="btn btn--primary qr-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><path d="M13.5 13.5h3v3h-3zM20.5 13.5v2M13.5 20.5h2M18.5 18.5h2v2"/></svg>
          出示接送码
        </button>
      </section>

      <section class="people" aria-labelledby="people-title">
        <div class="row between people-head">
          <h2 id="people-title">可接送人</h2>
          <button class="link-btn" type="button">管理</button>
        </div>
        <div class="card people-card">
          <div class="row-item">
            <div class="row">
              <span class="avatar avatar--sm" aria-hidden="true">妈</span>
              <div>
                <b class="person-name">妈妈</b>
                <p class="person-sub">本人 · 138****6721</p>
              </div>
            </div>
            <span class="chip chip--xs">默认</span>
          </div>
          <div class="row-item">
            <div class="row">
              <span class="avatar avatar--sm" aria-hidden="true">奶</span>
              <div>
                <b class="person-name">奶奶</b>
                <p class="person-sub">授权人 · 已通过审核</p>
              </div>
            </div>
            <span class="chev" aria-hidden="true">›</span>
          </div>
        </div>
      </section>
    </main>

    <nav class="mp-nav" aria-label="主导航">
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></svg>
        首页
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 5.3A2.3 2.3 0 0 1 6.1 3H11v16.8H6.1a2.3 2.3 0 0 0-2.3 2.3V5.3Z"/><path d="M20.2 5.3A2.3 2.3 0 0 0 17.9 3H13v16.8h4.9a2.3 2.3 0 0 1 2.3 2.3V5.3Z"/></svg>
        成长
      </a>
      <a class="is-on" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.2h13.2"/><path d="m14.2 5.2 3 3-3 3"/><path d="M20 15.8H6.8"/><path d="m9.8 12.8-3 3 3 3"/></svg>
        接送
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.4" r="3.4"/><path d="M4.8 20c.7-3.9 3.6-6 7.2-6s6.5 2.1 7.2 6"/></svg>
        我的
      </a>
    </nav>
  </div>
</body>
</html>
