<!DOCTYPE html>
<html lang="zh-CN" data-surface="teacher">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>接送记录 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mp-app" data-state="normal" data-od-id="pickup-records-page">

    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <header class="mp-navbar">
      <button class="mp-back" id="backBtn" type="button" aria-label="返回接送管理">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <h1 class="mp-title" data-od-id="pickup-records-title">接送记录</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main page">

      <!-- 日期卡：账页页眉 -->
      <section class="date-card" data-od-id="pickup-records-date">
        <div class="date-row">
          <button class="date-arrow" id="prevDay" type="button" aria-label="前一天" data-od-id="pickup-records-prev-day">‹</button>
          <button class="date-current" id="dateBtn" type="button" aria-haspopup="dialog" aria-controls="dateSheet" aria-expanded="false" data-od-id="pickup-records-date-button">
            <svg class="date-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M5.2 1.8v3M10.8 1.8v3M2.5 7h11"/></svg>
            <span class="date-main" id="dateMain">10月26日</span>
            <span class="date-week" id="dateWeek">周一</span>
            <span class="today-pill" id="todayPill">今天</span>
            <svg class="date-caret" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 5.5 3.5 3.5 3.5-3.5"/></svg>
          </button>
          <button class="date-arrow" id="nextDay" type="button" aria-label="后一天" disabled data-od-id="pickup-records-next-day">›</button>
        </div>

        <div class="summary" id="summary" data-od-id="pickup-records-summary">
          <div class="summary-cell">
            <span class="summary-value"><b id="sumTotal">13</b><i>条</i></span>
            <span class="summary-skel summary-skel--s" aria-hidden="true"></span>
            <span class="summary-dash" aria-hidden="true">—</span>
            <span class="summary-label">记录</span>
          </div>
          <div class="summary-cell">
            <span class="summary-value"><b id="sumPickup">4</b><i>条</i></span>
            <span class="summary-skel summary-skel--m" aria-hidden="true"></span>
            <span class="summary-dash" aria-hidden="true">—</span>
            <span class="summary-label">接走</span>
          </div>
          <div class="summary-cell">
            <span class="summary-value"><b id="sumDropoff">9</b><i>条</i></span>
            <span class="summary-skel summary-skel--l" aria-hidden="true"></span>
            <span class="summary-dash" aria-hidden="true">—</span>
            <span class="summary-label">入园签到</span>
          </div>
        </div>
      </section>

      <!-- 分组头：一次只查一天 -->
      <div class="group-head normal-only" data-od-id="pickup-records-group">
        <h2 class="group-title">
          <span id="groupDate">10月26日 周一</span>
          <span class="group-sep" aria-hidden="true">·</span>
          <span class="group-count" id="groupCount">共 13 条</span>
        </h2>
        <span class="group-class">小一班</span>
      </div>

      <!-- 时间轴由 app.js 按 recorded_at DESC 渲染 -->
      <div class="timeline-card normal-only" id="recordList" aria-live="polite" data-od-id="pickup-records-timeline"></div>

      <!-- 加载态：与真实行同构的 4 行骨架 -->
      <div class="state-loading" data-od-id="pickup-records-loading">
        <p class="visually-hidden" role="status">加载中...</p>
        <div class="skeleton-card" aria-hidden="true">
          <div class="skel-row">
            <span class="skel-time"></span>
            <span class="skel-rail"><span class="skel-dot"></span></span>
            <span class="skel-body">
              <span class="skel-top"><span class="skel-avatar"></span><span class="skel-line skel-line--name"></span><span class="skel-tag"></span></span>
              <span class="skel-line skel-line--meta"></span>
            </span>
          </div>
          <div class="skel-row">
            <span class="skel-time"></span>
            <span class="skel-rail"><span class="skel-dot"></span></span>
            <span class="skel-body">
              <span class="skel-top"><span class="skel-avatar"></span><span class="skel-line skel-line--name"></span><span class="skel-tag"></span></span>
              <span class="skel-line skel-line--meta"></span>
            </span>
          </div>
          <div class="skel-row">
            <span class="skel-time"></span>
            <span class="skel-rail"><span class="skel-dot"></span></span>
            <span class="skel-body">
              <span class="skel-top"><span class="skel-avatar"></span><span class="skel-line skel-line--name"></span><span class="skel-tag"></span></span>
              <span class="skel-line skel-line--meta"></span>
            </span>
          </div>
          <div class="skel-row">
            <span class="skel-time"></span>
            <span class="skel-rail"><span class="skel-dot"></span></span>
            <span class="skel-body">
              <span class="skel-top"><span class="skel-avatar"></span><span class="skel-line skel-line--name"></span><span class="skel-tag"></span></span>
              <span class="skel-line skel-line--meta"></span>
            </span>
          </div>
        </div>
      </div>

      <!-- 空态 -->
      <section class="state-view state-empty" data-od-id="pickup-records-empty" aria-labelledby="emptyTitle">
        <span class="state-icon state-icon--neutral" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5" width="17" height="18.5" rx="3"/><path d="M10.2 5V3.8c0-.7.6-1.3 1.3-1.3h5c.7 0 1.3.6 1.3 1.3V5"/><path d="M10 12.5h8M10 16.5h5.5"/></svg>
        </span>
        <h2 id="emptyTitle">这天没有接送记录</h2>
        <p id="emptyDesc">换个日期看看，或下拉刷新</p>
        <button class="state-btn" id="emptyTodayBtn" type="button" data-od-id="pickup-records-empty-today">回到今天</button>
      </section>

      <!-- 失败态 -->
      <section class="state-view state-error" data-od-id="pickup-records-error" aria-labelledby="errorTitle">
        <span class="state-icon state-icon--danger" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.2 25.2 24H2.8L14 4.2Z"/><path d="M14 11v6.2"/><circle cx="14" cy="21.4" r="1" fill="currentColor" stroke="none"/></svg>
        </span>
        <h2 id="errorTitle">接送记录加载失败</h2>
        <p id="errorDesc">网络异常，没取到 10月26日 的接送记录，请重试</p>
        <button class="state-btn" id="retryBtn" type="button" data-od-id="pickup-records-retry">重试</button>
      </section>

    </main>

    <div class="mp-demo" data-open="false">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" data-mp-state="empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" data-mp-state="error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 日期选择 -->
    <div class="sheet-layer" id="dateSheet" data-od-id="pickup-records-date-sheet" hidden>
      <button class="sheet-backdrop" type="button" tabindex="-1" data-close="dateSheet" aria-label="关闭选择日期"></button>
      <section class="sheet sheet--date" role="dialog" aria-modal="true" aria-labelledby="dateSheetTitle">
        <span class="sheet-grab" aria-hidden="true"></span>
        <header class="sheet-head">
          <div>
            <h2 id="dateSheetTitle">选择日期</h2>
            <p class="sheet-sub">最近 7 天</p>
          </div>
          <button class="sheet-close" type="button" data-close="dateSheet" aria-label="关闭选择日期">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m4 4 10 10M14 4 4 14"/></svg>
          </button>
        </header>
        <div class="sheet-body" id="dateList"></div>
      </section>
    </div>

    <!-- 记录详情 -->
    <div class="sheet-layer" id="detailSheet" data-od-id="pickup-records-detail-sheet" hidden>
      <button class="sheet-backdrop" type="button" tabindex="-1" data-close="detailSheet" aria-label="关闭记录详情"></button>
      <section class="sheet sheet--detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <span class="sheet-grab" aria-hidden="true"></span>
        <header class="sheet-head">
          <div>
            <h2 id="detailTitle">接送记录详情</h2>
            <p class="sheet-sub" id="detailSub"></p>
          </div>
          <button class="sheet-close" type="button" data-close="detailSheet" aria-label="关闭记录详情">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m4 4 10 10M14 4 4 14"/></svg>
          </button>
        </header>
        <div class="sheet-body" id="detailBody"></div>
        <footer class="sheet-footer">
          <button class="btn-primary btn-block" id="detailCloseBtn" type="button" data-close="detailSheet" data-od-id="pickup-records-detail-close">关闭</button>
        </footer>
      </section>
    </div>

  </div>
  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
