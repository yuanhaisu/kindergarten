<!doctype html>
<html lang="zh-CN" data-surface="teacher">
<head>
  <script src="../../_shared/theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 · 养成星球</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mp-app" data-state="normal">

  <div class="mp-statusbar" aria-hidden="true">
    <span class="mp-time">9:41</span>
    <span class="mp-status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
    </span>
  </div>

  <header class="mp-navbar">
    <button class="mp-back" type="button" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
    </button>
    <h1 class="mp-title">我的</h1>
    <div class="mp-capsule" aria-hidden="true">
      <span class="mp-capsule-dots">···</span>
      <span class="mp-capsule-divider"></span>
      <span class="mp-capsule-ring">◎</span>
    </div>
  </header>

  <main class="mp-main page">

    <!-- 1. 工牌式个人信息卡 -->
    <section class="id-card" aria-labelledby="id-name">
      <span class="id-avatar" aria-hidden="true">王</span>
      <div class="id-body">
        <h2 class="id-name" id="id-name">王老师</h2>
        <p class="id-org">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 20.5h17"/>
            <path d="M5.2 20.5V9.8l6.8-3.2 6.8 3.2v10.7"/>
            <path d="M9.6 20.5v-5h4.8v5"/>
            <path d="M12 3.2v1.5"/>
          </svg>
          <span class="when-normal">阳光幼儿园</span>
          <span class="when-empty">未绑定园所</span>
        </p>
        <div class="id-tags" aria-label="班级与职务">
          <span class="id-tag">小一班</span>
          <span class="id-tag">主班老师</span>
        </div>
      </div>
    </section>

    <!-- 2. 今日班级数字带 -->
    <section class="today" aria-labelledby="today-title">
      <div class="today-head">
        <h2 class="today-title" id="today-title">今日班级</h2>
        <span class="today-meta">
          <span class="meta-normal">小一班 · 在园 28 人</span>
          <span class="meta-loading">同步中…</span>
        </span>
      </div>

      <div class="stat-card">
        <div class="stat">
          <span class="stat-v"><span class="stat-num">26</span><span class="stat-dash">—</span><span class="sk sk-num"></span></span>
          <span class="stat-k">今日出勤</span>
        </div>
        <div class="stat">
          <span class="stat-v"><span class="stat-num">2</span><span class="stat-dash">—</span><span class="sk sk-num"></span></span>
          <span class="stat-k">今日请假</span>
        </div>
        <div class="stat">
          <span class="stat-v"><span class="stat-num stat-num--pill">3</span><span class="stat-dash">—</span><span class="sk sk-num"></span></span>
          <span class="stat-k">待审批</span>
        </div>
      </div>

      <div class="stat-empty">
        <span class="stat-empty-ico" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m4 10.5 8-6.5 8 6.5"/>
            <path d="M6.2 9.4v9.4h11.6V9.4"/>
            <path d="M10 18.8v-4.6h4v4.6"/>
          </svg>
        </span>
        <p class="stat-empty-text">还没有绑定园所，今日班级数据暂不可用</p>
        <button type="button" class="btn-soft" id="refresh-profile">刷新资料</button>
      </div>

      <div class="stat-error" role="alert">
        <span class="stat-error-ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.4"/>
            <path d="M12 7.8v4.6M12 16h.01"/>
          </svg>
        </span>
        <p class="stat-error-text">今日数据加载失败</p>
        <button type="button" class="btn-soft" id="retry">重试</button>
      </div>
    </section>

    <!-- 3. 账号与设置 -->
    <section class="settings" aria-labelledby="settings-title">
      <h2 class="group-title" id="settings-title">账号与设置</h2>
      <div class="cell-card">
        <button type="button" class="cell" data-feature="邀请码">
          <span class="cell-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.6 9.4V7a1.6 1.6 0 0 1 1.6-1.6h13.6A1.6 1.6 0 0 1 20.4 7v2.4a2.6 2.6 0 0 0 0 5.2V17a1.6 1.6 0 0 1-1.6 1.6H5.2A1.6 1.6 0 0 1 3.6 17v-2.4a2.6 2.6 0 0 0 0-5.2Z"/>
              <path d="M12 8.6v1.2M12 11.8v1.2M12 15v1.2"/>
            </svg>
          </span>
          <span class="cell-main">
            <span class="cell-title">邀请码</span>
            <span class="cell-desc">分享或管理邀请码</span>
          </span>
          <span class="cell-badge">开发中</span>
        </button>

        <button type="button" class="cell" data-feature="账号安全">
          <span class="cell-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.4 5.2 5.9v5.2c0 4.2 2.8 7.4 6.8 8.7 4-1.3 6.8-4.5 6.8-8.7V5.9L12 3.4Z"/>
              <path d="m9 11.7 2.1 2.1 3.9-4.1"/>
            </svg>
          </span>
          <span class="cell-main">
            <span class="cell-title">账号安全</span>
            <span class="cell-desc">修改手机号、绑定微信</span>
          </span>
          <span class="cell-badge">开发中</span>
        </button>

        <button type="button" class="cell" data-feature="设置">
          <span class="cell-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3.2"/>
              <path d="M12 4.2v2M12 17.8v2M4.2 12h2M17.8 12h2M6.5 6.5l1.4 1.4M16.1 16.1l1.4 1.4M17.5 6.5l-1.4 1.4M7.9 16.1l-1.4 1.4"/>
            </svg>
          </span>
          <span class="cell-main">
            <span class="cell-title">设置</span>
            <span class="cell-desc">关于、意见反馈</span>
          </span>
          <span class="cell-badge">开发中</span>
        </button>
      </div>
    </section>

    <!-- 4. 退出登录 -->
    <button type="button" class="logout" id="logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.6 7.8V6.2a1.8 1.8 0 0 0-1.8-1.8H6.4a1.8 1.8 0 0 0-1.8 1.8v11.6a1.8 1.8 0 0 0 1.8 1.8h6.4a1.8 1.8 0 0 0 1.8-1.8v-1.6"/>
        <path d="M10.2 12h9.4"/>
        <path d="m16.8 8.8 3.2 3.2-3.2 3.2"/>
      </svg>
      <span>退出登录</span>
    </button>
  </main>

  <!-- 原型演示状态切换（固定右下角，默认收起） -->
  <div class="mp-demo" data-open="false">
    <div class="mp-demo-chips" role="group" aria-label="原型状态">
      <button class="mp-demo-chip" data-mp-state="normal" aria-pressed="true">正常</button>
      <button class="mp-demo-chip" data-mp-state="empty" aria-pressed="false">空态</button>
      <button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
      <button class="mp-demo-chip" data-mp-state="error" aria-pressed="false">失败</button>
    </div>
    <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
  </div>

  <!-- 退出登录确认对话框 -->
  <div class="overlay" id="logout-overlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="logout-title">
      <h2 class="dialog-title" id="logout-title">退出登录</h2>
      <p class="dialog-sub">确定要退出当前账号吗？</p>
      <div class="dialog-actions">
        <button type="button" class="dialog-btn" data-close>取消</button>
        <button type="button" class="dialog-btn dialog-btn--danger" id="logout-confirm">退出登录</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="../../_shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
