<!doctype html>
<html lang="zh-CN" data-surface="teacher">
<head>
  <script src="../../_shared/theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>班级日历 · 养成星球</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mp-app" data-state="normal">

  <div class="mp-statusbar" aria-hidden="true">
    <span class="mp-time">9:41</span>
    <span class="mp-status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
    </span>
  </div>

  <header class="mp-navbar">
    <button class="mp-back" type="button" aria-label="返回工作台">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
    </button>
    <h1 class="mp-title">班级日历</h1>
    <div class="mp-capsule" aria-hidden="true">
      <span class="mp-capsule-dots">···</span>
      <span class="mp-capsule-divider"></span>
      <span class="mp-capsule-ring">◎</span>
    </div>
  </header>

  <main class="mp-main">
    <div class="page">

      <section class="month-bar" aria-label="月份切换">
        <button class="month-nav" id="prevMonth" type="button" aria-label="上一月">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
        </button>
        <div class="month-core">
          <h2 class="month-label" id="monthLabel">2026年10月</h2>
          <p class="month-sub" id="monthSub">本月 11 个活动</p>
        </div>
        <button class="month-nav" id="nextMonth" type="button" aria-label="下一月">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
        </button>
        <button class="add-btn" id="addBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          <span>添加</span>
        </button>
      </section>

      <section class="cal-card" aria-label="月历">
        <div class="week-row" aria-hidden="true">
          <span class="week-day is-weekend">日</span>
          <span class="week-day">一</span>
          <span class="week-day">二</span>
          <span class="week-day">三</span>
          <span class="week-day">四</span>
          <span class="week-day">五</span>
          <span class="week-day is-weekend">六</span>
        </div>
        <div class="cal-grid" id="calGrid" role="group" aria-label="选择日期"></div>
        <div class="cal-legend" id="calLegend"></div>
      </section>

      <div class="cal-skeleton" id="calSkeleton" aria-hidden="true">
        <div class="sk-week">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="sk-grid" id="skGrid"></div>
        <div class="sk-legend">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <section class="day-section" aria-label="当日安排">
        <div class="day-head">
          <div class="day-head-main">
            <h2 class="day-title">当日安排</h2>
            <p class="day-date" id="dayDate">10月26日 周一</p>
          </div>
          <span class="day-count" id="dayCount">2 个活动</span>
        </div>
        <div class="event-list" id="eventList"></div>
        <div class="day-empty" id="dayEmpty" hidden>
          <span class="empty-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="5"/><path d="M8 3v4M16 3v4M3 10.5h18"/><path d="M9 15.5h6"/></svg>
          </span>
          <p class="empty-title" id="emptyTitle">10月26日暂无活动安排</p>
          <p class="empty-desc">可以添加一场活动，家长端会同步看到。</p>
          <button class="empty-btn" id="emptyAddBtn" type="button">添加活动</button>
        </div>
      </section>

      <div class="day-skeleton" id="daySkeleton" aria-hidden="true">
        <div class="sk-head">
          <span class="sk-bar" style="width: 112px"></span>
          <span class="sk-bar" style="width: 48px"></span>
        </div>
        <div class="sk-card">
          <span class="sk-line w60"></span>
          <span class="sk-line w40"></span>
          <span class="sk-line w80"></span>
        </div>
        <div class="sk-card">
          <span class="sk-line w50"></span>
          <span class="sk-line w70"></span>
          <span class="sk-line w30"></span>
        </div>
      </div>

      <div class="error-block" id="errorBlock" role="alert">
        <span class="error-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.4" r=".9" fill="currentColor" stroke="none"/></svg>
        </span>
        <p class="error-title">日历加载失败</p>
        <p class="error-desc">网络异常，未获取到本月活动。</p>
        <button class="error-btn" id="retryBtn" type="button">重新加载</button>
      </div>

    </div>
  </main>

  <div class="mp-demo" data-open="false">
    <div class="mp-demo-chips" role="group" aria-label="原型状态">
      <button class="mp-demo-chip" data-mp-state="normal" aria-pressed="true">正常</button>
      <button class="mp-demo-chip" data-mp-state="empty" aria-pressed="false">空态</button>
      <button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
      <button class="mp-demo-chip" data-mp-state="error" aria-pressed="false">失败</button>
    </div>
    <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
  </div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../_shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
