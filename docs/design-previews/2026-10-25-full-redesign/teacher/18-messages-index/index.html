<!doctype html>
<html lang="zh-CN" data-surface="teacher">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>消息 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-notice" viewBox="0 0 24 24">
        <path d="M4.5 10.2v3.6a1.8 1.8 0 0 0 1.8 1.8h1.9l7.3 3.7V4.7L8.2 8.4H6.3a1.8 1.8 0 0 0-1.8 1.8Z"/>
        <path d="M8.4 15.7v2.4a1.8 1.8 0 0 0 3.3.9l1.4-2.2"/>
        <path d="M19 9.6a3.4 3.4 0 0 1 0 4.8"/>
      </symbol>
      <symbol id="i-leave" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
        <path d="M8 3.5v3M16 3.5v3M3.5 10h17"/>
        <path d="m8.6 15 2.2 2.2 4.6-4.5"/>
      </symbol>
      <symbol id="i-system" viewBox="0 0 24 24">
        <rect x="3.5" y="4.5" width="17" height="6" rx="2"/>
        <rect x="3.5" y="13.5" width="17" height="6" rx="2"/>
        <path d="M7.5 7.5h.01M7.5 16.5h.01M11 7.5h5.5M11 16.5h5.5"/>
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7"/>
      </symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24">
        <path d="m4.5 12.8 2.6-7A2 2 0 0 1 8.9 4.5h6.2a2 2 0 0 1 1.9 1.3l2.6 7v4.2a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2v-4.2Z"/>
        <path d="M4.5 12.8h4l1.2 2.2h4.6l1.2-2.2h4"/>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M19.2 9A8 8 0 1 0 20 14"/>
        <path d="M19.5 4.5V9H15"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 7.6v5.1M12 16.2v.2"/>
      </symbol>
    </defs>
  </svg>

  <div class="mp-app" id="messagesApp" data-state="normal" data-od-id="messages-screen">
    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1"/>
          <rect x="4.5" y="5" width="3" height="6" rx="1"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1"/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/>
          <path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/>
          <path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/>
          <circle cx="7.5" cy="10" r=".7" fill="currentColor"/>
        </svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none" aria-hidden="true">
          <rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/>
          <rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/>
          <path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/>
        </svg>
      </span>
    </div>

    <header class="mp-navbar">
      <button class="mp-back" id="backBtn" type="button" aria-label="返回上一页">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.5 4.5 7 10l5.5 5.5"/>
        </svg>
      </button>
      <h1 class="mp-title">消息</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main">
      <div class="page">
        <section class="view view-normal" aria-label="消息收件箱">
          <div class="inbox-toolbar" data-od-id="message-filters">
            <div class="segmented" role="group" aria-label="消息分类">
              <button class="seg-btn" type="button" data-filter="all" aria-pressed="true" aria-controls="inboxList">
                <span class="seg-label">全部</span><span class="seg-count" data-count="all">12</span>
              </button>
              <button class="seg-btn" type="button" data-filter="notice" aria-pressed="false" aria-controls="inboxList">
                <span class="seg-label">通知</span><span class="seg-count" data-count="notice">5</span>
              </button>
              <button class="seg-btn" type="button" data-filter="leave" aria-pressed="false" aria-controls="inboxList">
                <span class="seg-label">审批</span><span class="seg-count" data-count="leave">4</span>
              </button>
              <button class="seg-btn" type="button" data-filter="system" aria-pressed="false" aria-controls="inboxList">
                <span class="seg-label">系统</span><span class="seg-count" data-count="system">3</span>
              </button>
            </div>
          </div>

          <div class="inbox-meta" data-od-id="inbox-meta">
            <p class="inbox-summary" id="listSummary" aria-live="polite" aria-atomic="true">共 12 条 · 4 条未读</p>
            <button class="mark-all" id="markAllBtn" type="button" aria-disabled="false" aria-controls="inboxList" data-od-id="mark-all-read">全部已读</button>
          </div>

          <div class="inbox-card" id="inboxList" role="list" aria-label="消息列表" aria-busy="true" data-od-id="inbox-list"></div>

          <div class="category-empty" id="categoryEmpty" hidden>
            <svg class="ico" width="24" height="24" aria-hidden="true"><use href="#i-inbox"></use></svg>
            <p>该分类暂无消息</p>
          </div>
        </section>

        <section class="view view-empty" aria-labelledby="emptyTitle" data-od-id="messages-empty">
          <span class="state-icon state-icon--empty" aria-hidden="true">
            <svg class="ico" width="30" height="30"><use href="#i-inbox"></use></svg>
          </span>
          <h2 class="state-title" id="emptyTitle">暂无消息</h2>
          <p class="state-copy">收到的通知、审批与系统消息会汇总到这里</p>
          <button class="btn btn-primary" id="refreshEmptyBtn" type="button">
            <svg class="ico btn-ico" width="15" height="15" aria-hidden="true"><use href="#i-refresh"></use></svg>
            刷新消息
          </button>
        </section>

        <section class="view view-loading" role="status" aria-live="polite" data-od-id="messages-loading">
          <span class="sr-only">正在加载消息</span>
          <div class="skeleton-card" aria-hidden="true">
            <div class="skeleton-row">
              <span class="sk sk-icon"></span>
              <span class="sk-copy"><span class="sk sk-line sk-title"></span><span class="sk sk-line sk-body"></span></span>
              <span class="sk sk-time"></span>
            </div>
            <div class="skeleton-row">
              <span class="sk sk-icon"></span>
              <span class="sk-copy"><span class="sk sk-line sk-title"></span><span class="sk sk-line sk-body"></span></span>
              <span class="sk sk-time"></span>
            </div>
            <div class="skeleton-row">
              <span class="sk sk-icon"></span>
              <span class="sk-copy"><span class="sk sk-line sk-title"></span><span class="sk sk-line sk-body"></span></span>
              <span class="sk sk-time"></span>
            </div>
            <div class="skeleton-row">
              <span class="sk sk-icon"></span>
              <span class="sk-copy"><span class="sk sk-line sk-title"></span><span class="sk sk-line sk-body"></span></span>
              <span class="sk sk-time"></span>
            </div>
            <div class="skeleton-row">
              <span class="sk sk-icon"></span>
              <span class="sk-copy"><span class="sk sk-line sk-title"></span><span class="sk sk-line sk-body"></span></span>
              <span class="sk sk-time"></span>
            </div>
          </div>
        </section>

        <section class="view view-error" role="alert" aria-labelledby="errorTitle" data-od-id="messages-error">
          <span class="state-icon state-icon--error" aria-hidden="true">
            <svg class="ico" width="30" height="30"><use href="#i-alert"></use></svg>
          </span>
          <h2 class="state-title" id="errorTitle">消息加载失败</h2>
          <p class="state-copy">网络异常，请稍后重试</p>
          <button class="btn btn-primary" id="retryBtn" type="button">重试</button>
        </section>

        <div class="demo-clearance" aria-hidden="true"></div>
      </div>
    </main>

    <div class="mp-demo" id="demoPanel" data-open="false" style="bottom: calc(20px + env(safe-area-inset-bottom))">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" type="button" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" type="button" data-mp-state="empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" type="button" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" type="button" data-mp-state="error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
