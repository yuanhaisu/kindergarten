    </div>

  <div class="mp-demo" data-open="false">
    <div class="mp-demo-chips" role="group" aria-label="原型状态">
      <button class="mp-demo-chip" type="button" data-mp-state="normal" aria-pressed="true">正常</button>
      <button class="mp-demo-chip" type="button" data-mp-state="empty" aria-pressed="false">空态</button>
      <button class="mp-demo-chip" type="button" data-mp-state="loading" aria-pressed="false">加载</button>
      <button class="mp-demo-chip" type="button" data-mp-state="error" aria-pressed="false">失败</button>
    </div>
    <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
  </div>

  <div class="sheet-layer" id="sheetLayer" data-open="false" aria-hidden="true">
    <div class="sheet-scrim" data-close-sheet></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName" data-od-id="sheet">
      <span class="sheet-grab" aria-hidden="true"></span>
      <div class="sheet-head">
        <span class="sheet-av" id="sheetAvatar" aria-hidden="true">乐</span>
        <div class="sheet-id">
          <h2 class="sheet-name" id="sheetName">乐乐</h2>
          <span class="sheet-pill" id="sheetPill" data-status="picked_up"><i class="dot" aria-hidden="true"></i><span id="sheetPillText">已接走</span></span>
        </div>
      </div>
      <dl class="sheet-rows">
        <div class="sheet-row"><dt class="sheet-label">入园时间</dt><dd class="sheet-value" id="sheetTime">08:02</dd></div>
        <div class="sheet-row"><dt class="sheet-label">接送状态</dt><dd class="sheet-value" id="sheetStatus">已接走</dd></div>
        <div class="sheet-row"><dt class="sheet-label">授权接送人</dt><dd class="sheet-value" id="sheetPersons">妈妈、爷爷</dd></div>
        <div class="sheet-row"><dt class="sheet-label">接送截止</dt><dd class="sheet-value" id="sheetDeadline">16:30</dd></div>
      </dl>
      <button class="sheet-close" id="sheetClose" type="button" data-close-sheet data-od-id="sheet-close">关闭</button>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="../../_shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
