<!doctype html>
<html lang="zh-CN" data-surface="teacher">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>老师登录 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="../../_shared/shell.css" />
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mp-app" data-state="empty">

    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <!-- 登录页是入口根页面：不画 mp-back -->
    <header class="mp-navbar">
      <h1 class="mp-title">老师登录</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main screen">

      <section class="brand-block" data-od-id="brand-block">
        <div class="brand-mark">
          <svg class="brand-logo" viewBox="0 0 80 80" role="img" aria-label="养成星球标志">
            <defs>
              <linearGradient id="planet-gradient" x1="20" y1="16" x2="62" y2="66" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="var(--accent-soft)" />
                <stop offset="1" stop-color="var(--accent)" />
              </linearGradient>
              <radialGradient id="planet-sheen" cx="0.34" cy="0.3" r="0.55">
                <stop offset="0" stop-color="var(--accent-wash)" stop-opacity="0.5" />
                <stop offset="1" stop-color="var(--accent-wash)" stop-opacity="0" />
              </radialGradient>
            </defs>
            <g transform="rotate(-20 40 40)">
              <ellipse cx="40" cy="40" rx="33" ry="11.5" fill="none" stroke="var(--accent-soft)" stroke-width="1.2" opacity="0.55" />
              <circle cx="72" cy="40" r="2.4" fill="var(--accent-deep)" />
            </g>
            <circle cx="40" cy="40" r="21.5" fill="url(#planet-gradient)" />
            <circle cx="40" cy="40" r="21.5" fill="url(#planet-sheen)" />
          </svg>
        </div>
        <p class="brand-name">养成星球</p>
        <p class="brand-tagline">幼儿园数字化管理平台</p>
      </section>

      <section class="login-card" id="login-card" data-od-id="login-card">
        <div class="error-strip" id="error-strip" role="alert" data-od-id="error-strip">
          <p class="error-title">微信登录失败</p>
          <p class="error-desc">请稍后重试</p>
        </div>

        <button class="login-btn" id="login-btn" type="button" data-od-id="login-button">
          <svg class="login-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12.4 4.4c-4.1 0-7.4 2.7-7.4 6 0 1.9 1.1 3.6 2.8 4.7l-.8 2.5 2.9-1.5c.8.2 1.6.3 2.5.3 4.1 0 7.4-2.7 7.4-6s-3.3-6-7.4-6Z"
              fill="none" stroke="var(--on-brand)" stroke-width="1.6" stroke-linejoin="round" />
            <circle cx="9.9" cy="10.2" r="1.15" fill="var(--on-brand)" />
            <circle cx="14.9" cy="10.2" r="1.15" fill="var(--on-brand)" />
          </svg>
          <span class="login-btn__label login-btn__label--idle">微信授权登录</span>
          <span class="login-btn__label login-btn__label--pending">登录中...</span>
          <span class="login-btn__label login-btn__label--retry">重新登录</span>
        </button>

        <button class="agree-row" id="agree-row" type="button" role="checkbox" aria-checked="false" aria-disabled="false" data-od-id="agreement-row">
          <span class="agree-box" aria-hidden="true">
            <svg class="agree-check" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
              <path d="M2.4 6.2 4.8 8.5 9.6 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="agree-text">我已阅读并同意《用户协议》和《隐私政策》</span>
        </button>
      </section>

      <p class="footnote" data-od-id="footer-note">仅对幼儿园老师开放，需园方统一开通账号</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="mp-demo" data-open="false">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" data-mp-state="normal" aria-pressed="false">正常</button>
        <button class="mp-demo-chip" data-mp-state="empty" aria-pressed="true">空态</button>
        <button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" data-mp-state="error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>

  </div>
  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
