<!doctype html>
<html lang="zh-CN" data-surface="teacher">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>添加活动 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-chevron" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6v4.2M8 11.2v.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.2v4M8 4.9v.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.4 8.2 3.1 3.1 6.1-6.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="mp-app" data-state="normal" data-od-id="create-event">
    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <header class="mp-navbar">
      <button class="mp-back" type="button" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <h1 class="mp-title" id="page-title">添加活动</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main">
      <form class="event-form" id="event-form" novalidate data-od-id="event-form">
        <section class="event-group" aria-labelledby="group-basic">
          <h2 class="group-title" id="group-basic" data-od-id="group-basic">基本信息</h2>
          <div class="event-card" data-od-id="event-card-basic">
            <div class="card-live card-live--pad">
              <div class="field">
                <label class="field-label" for="event-title">活动标题<span class="req" aria-hidden="true">*</span></label>
                <input class="event-input event-input--title" id="event-title" name="title" type="text" value="秋季亲子运动会" placeholder="请输入活动标题" autocomplete="off" required aria-describedby="title-error">
                <p class="field-error" id="title-error" role="alert" hidden>
                  <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-alert"/></svg>
                  <span>请输入活动标题</span>
                </p>
              </div>
              <div class="field">
                <span class="field-label" id="type-label">活动类型<span class="req" aria-hidden="true">*</span></span>
                <div class="type-pills" id="type-pills" role="radiogroup" aria-labelledby="type-label" aria-required="true" data-od-id="event-type">
                  <button class="type-pill" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="notice">通知</button>
                  <button class="type-pill" type="button" role="radio" aria-checked="true" tabindex="0" data-value="activity">活动</button>
                  <button class="type-pill" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="holiday">假期</button>
                  <button class="type-pill" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="meeting">家长会</button>
                  <button class="type-pill" type="button" role="radio" aria-checked="false" tabindex="-1" data-value="checkup">体检</button>
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="event-description">活动描述</label>
                <textarea class="event-input event-textarea" id="event-description" name="description" rows="3" placeholder="请输入活动描述，如活动内容、注意事项等">邀请家长与孩子共同参加接力、拔河与亲子律动，请穿运动鞋、自备水杯。</textarea>
              </div>
            </div>
            <div class="card-skeleton" aria-hidden="true">
              <span class="sk sk-label"></span>
              <span class="sk sk-input"></span>
              <span class="sk sk-label sk-label--short"></span>
              <div class="sk-pills">
                <span class="sk sk-pill"></span><span class="sk sk-pill"></span><span class="sk sk-pill"></span><span class="sk sk-pill"></span><span class="sk sk-pill"></span>
              </div>
              <span class="sk sk-label"></span>
              <span class="sk sk-textarea"></span>
            </div>
          </div>
        </section>

        <section class="event-group" aria-labelledby="group-schedule">
          <h2 class="group-title" id="group-schedule" data-od-id="group-schedule">时间地点</h2>
          <div class="event-card" data-od-id="event-card-schedule">
            <div class="card-live">
              <button class="event-cell" id="date-row" type="button" aria-haspopup="dialog" aria-describedby="date-error">
                <span class="cell-label">活动日期<span class="req" aria-hidden="true">*</span></span>
                <span class="cell-trailing">
                  <span class="cell-value" id="date-value">2026-10-30</span>
                  <span class="cell-badge" id="date-weekday">周五</span>
                  <svg class="cell-chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron"/></svg>
                </span>
              </button>
              <p class="field-error cell-error" id="date-error" role="alert" hidden>
                <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-alert"/></svg>
                <span>请选择活动日期</span>
              </p>
              <button class="event-cell event-cell--divided" id="start-row" type="button" aria-haspopup="dialog">
                <span class="cell-label">开始时间</span>
                <span class="cell-trailing">
                  <span class="cell-value" id="start-value">09:00</span>
                  <svg class="cell-chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron"/></svg>
                </span>
              </button>
              <button class="event-cell event-cell--divided" id="end-row" type="button" aria-haspopup="dialog" aria-describedby="time-error">
                <span class="cell-label">结束时间</span>
                <span class="cell-trailing">
                  <span class="cell-value" id="end-value">11:30</span>
                  <svg class="cell-chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron"/></svg>
                </span>
              </button>
              <p class="field-error cell-error" id="time-error" role="alert" hidden>
                <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-alert"/></svg>
                <span>结束时间需晚于开始时间</span>
              </p>
              <div class="switch-row switch-row--divided" data-od-id="all-day-row">
                <div class="switch-copy">
                  <span class="switch-title" id="allday-label">全天活动</span>
                  <span class="switch-hint" id="allday-desc">不设具体时刻（如假期）</span>
                </div>
                <button class="switch-control" id="allday-switch" type="button" role="switch" aria-checked="false" aria-labelledby="allday-label" aria-describedby="allday-desc">
                  <span class="switch-track" aria-hidden="true"></span>
                </button>
              </div>
              <div class="field field--inset">
                <label class="field-label" for="event-location">活动地点</label>
                <input class="event-input" id="event-location" name="location" type="text" value="大操场" placeholder="请输入活动地点" autocomplete="off">
              </div>
            </div>
            <div class="card-skeleton" aria-hidden="true">
              <div class="sk-row"><span class="sk sk-line sk-line--label"></span><span class="sk sk-line sk-line--value"></span></div>
              <div class="sk-row"><span class="sk sk-line sk-line--label"></span><span class="sk sk-line sk-line--value"></span></div>
              <div class="sk-row"><span class="sk sk-line sk-line--label"></span><span class="sk sk-line sk-line--value"></span></div>
              <div class="sk-row sk-row--switch">
                <span class="sk-copy"><span class="sk sk-line sk-switch-line"></span><span class="sk sk-line sk-subline"></span></span>
                <span class="sk sk-switch"></span>
              </div>
              <span class="sk sk-input sk-input--last"></span>
            </div>
          </div>
        </section>

        <section class="event-group" aria-labelledby="group-publish">
          <h2 class="group-title" id="group-publish" data-od-id="group-publish">发布设置</h2>
          <div class="event-card" data-od-id="event-card-publish">
            <div class="card-live">
              <div class="switch-row" id="notify-row" data-od-id="notify-row">
                <div class="switch-copy">
                  <span class="switch-title" id="notify-label">通知家长</span>
                  <span class="switch-hint" id="notify-desc">发布后向本班家长推送通知（可在通知模块查看已读）</span>
                </div>
                <button class="switch-control" id="notify-switch" type="button" role="switch" aria-checked="true" aria-labelledby="notify-label" aria-describedby="notify-desc">
                  <span class="switch-track" aria-hidden="true"></span>
                </button>
              </div>
              <div class="card-note card-note--solo" id="edit-notify-hint" hidden>
                <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-info"/></svg>
                <span>该活动已发布——保存时将让你确认是否通知家长（按变更内容预置建议）。</span>
              </div>
              <div class="card-note">
                <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-info"/></svg>
                <span>存为草稿不会通知家长</span>
              </div>
            </div>
            <div class="card-skeleton" aria-hidden="true">
              <div class="sk-row sk-row--switch">
                <span class="sk-copy"><span class="sk sk-line sk-switch-line"></span><span class="sk sk-line sk-subline"></span></span>
                <span class="sk sk-switch"></span>
              </div>
              <span class="sk sk-note"></span>
            </div>
          </div>
        </section>
      </form>
    </main>

    <div class="submit-dock" data-od-id="submit-dock">
      <div class="failure-bar" id="failure-bar" role="alert" hidden>
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-alert"/></svg>
        <span class="failure-text">发布失败：网络异常，请重试</span>
        <button class="failure-retry" id="retry-btn" type="button">重试</button>
      </div>
      <p class="submit-summary" id="submit-summary" data-od-id="submit-summary">活动 · 10月30日 09:00–11:30 · 通知家长</p>
      <div class="submit-actions">
        <button class="btn-draft" id="btn-draft" type="button" aria-disabled="false">
          <span class="spinner" aria-hidden="true"></span><span class="btn-text">存草稿</span>
        </button>
        <button class="btn-publish" id="btn-publish" type="button" aria-disabled="false" data-od-id="publish-event">
          <span class="spinner" aria-hidden="true"></span><span class="btn-text">发布活动</span>
        </button>
      </div>
    </div>

    <div class="sheet-layer" id="sheet-layer" data-open="false" aria-hidden="true">
      <button class="sheet-scrim" id="sheet-scrim" type="button" aria-label="关闭选择器" tabindex="-1"></button>
      <section class="picker-sheet" id="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title" tabindex="-1" data-od-id="date-time-picker">
        <span class="sheet-grab" aria-hidden="true"></span>
        <header class="picker-head">
          <button class="picker-btn picker-cancel" id="picker-cancel" type="button">取消</button>
          <h2 class="picker-title" id="picker-title">活动日期</h2>
          <button class="picker-btn picker-done" id="picker-done" type="button">完成</button>
        </header>
        <div class="wheel">
          <div class="wheel-band" aria-hidden="true"></div>
          <div class="wheel-cols" id="wheel-cols"></div>
          <div class="wheel-fade wheel-fade--top" aria-hidden="true"></div>
          <div class="wheel-fade wheel-fade--bottom" aria-hidden="true"></div>
        </div>
      </section>
    </div>

    <div class="sheet-layer" id="confirm-layer" data-open="false" aria-hidden="true">
      <button class="sheet-scrim" id="confirm-scrim" type="button" aria-label="关闭确认" tabindex="-1"></button>
      <section class="picker-sheet confirm-sheet" id="confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title" tabindex="-1" data-od-id="change-confirm-sheet">
        <span class="sheet-grab" aria-hidden="true"></span>
        <header class="confirm-head">
          <h2 class="confirm-title" id="confirm-title">通知家长？</h2>
          <p class="confirm-sub">将通知本班全体家长</p>
        </header>
        <p class="change-caption">本次变更</p>
        <div class="change-list" id="change-list"></div>
        <div class="switch-row confirm-notify">
          <div class="switch-copy">
            <span class="switch-title" id="confirm-notify-label">发布变更通知</span>
            <span class="switch-hint" id="confirm-notify-desc">家长端会在日历顶部看到此变更</span>
          </div>
          <button class="switch-control" id="confirm-notify-switch" type="button" role="switch" aria-checked="true" aria-labelledby="confirm-notify-label" aria-describedby="confirm-notify-desc">
            <span class="switch-track" aria-hidden="true"></span>
          </button>
        </div>
        <div class="confirm-actions">
          <button class="btn-draft" id="confirm-cancel" type="button"><span class="btn-text">取消</span></button>
          <button class="btn-publish" id="confirm-save" type="button"><span class="spinner" aria-hidden="true"></span><span class="btn-text">保存</span></button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="toast-icon" aria-hidden="true">
        <svg width="11" height="11" viewBox="0 0 16 16"><use href="#i-check"/></svg>
      </span>
      <span class="toast-text" id="toast-text">发布成功</span>
    </div>

    <div class="mp-demo" data-open="false" style="bottom: calc(112px + env(safe-area-inset-bottom))">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" type="button" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" type="button" data-mp-state="edit" aria-pressed="false">编辑</button>
        <button class="mp-demo-chip" type="button" data-mp-state="empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" type="button" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" type="button" data-mp-state="submitting" aria-pressed="false">提交中</button>
        <button class="mp-demo-chip" type="button" data-mp-state="failed" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>
  </div>

  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
