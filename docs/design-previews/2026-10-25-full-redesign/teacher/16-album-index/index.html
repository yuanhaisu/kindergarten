        <button class="btn-upload" type="button" data-action="upload" data-od-id="album-upload">
          <svg class="btn-glyph" aria-hidden="true"><use href="#i-plus"/></svg>
          <span>上传照片</span>
        </button>
      </div>

      <div class="viewer" id="album-viewer" hidden>
        <div class="viewer-scrim" data-viewer-close></div>
        <section class="viewer-sheet" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
          <div class="viewer-handle" aria-hidden="true"></div>
          <header class="viewer-head">
            <div class="viewer-heading">
              <h2 class="viewer-title" id="viewer-title">秋日郊游</h2>
              <p class="viewer-date" id="viewer-date">10月24日</p>
            </div>
            <button class="viewer-close" type="button" data-viewer-close aria-label="关闭大图">
              <svg aria-hidden="true"><use href="#i-close"/></svg>
            </button>
          </header>
          <div class="viewer-photo ph-4" id="viewer-photo" aria-hidden="true">
            <svg class="viewer-glyph"><use href="#i-image"/></svg>
          </div>
          <div class="viewer-foot">
            <button class="viewer-nav viewer-prev" id="viewer-prev" type="button" aria-label="上一张" disabled>
              <svg aria-hidden="true"><use href="#i-left"/></svg>
            </button>
            <p class="viewer-count" aria-live="polite">第 <span class="viewer-num" id="viewer-index">1</span> 张 <span class="viewer-total">/ 共 <span class="viewer-num" id="viewer-total">12</span> 张</span></p>
            <button class="viewer-nav viewer-next" id="viewer-next" type="button" aria-label="下一张">
              <svg aria-hidden="true"><use href="#i-right"/></svg>
            </button>
          </div>
        </section>
      </div>
    </main>

    <div class="mp-demo" data-open="false" style="bottom: calc(64px + 12px + env(safe-area-inset-bottom))">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" data-mp-state="empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" data-mp-state="error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
