<!doctype html>
<html lang="zh-CN" data-surface="parent">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>通知公告 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="../../_shared/shell.css" />
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mp-app" data-state="normal">

    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <header class="mp-navbar">
      <button class="mp-back" type="button" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <h1 class="mp-title">通知公告</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main">
      <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <symbol id="i-task" viewBox="0 0 24 24">
          <rect x="4" y="3.5" width="16" height="17" rx="3"/>
          <path d="M8 8.5 9.4 9.9 12 7.2M14 8.5h3M8 14.5l1.4 1.4L12 13.2M14 14.5h3"/>
        </symbol>
        <symbol id="i-activity" viewBox="0 0 24 24">
          <path d="M6 21V4.5M6 5h11.2l-2.3 3.5 2.3 3.5H6"/>
        </symbol>
        <symbol id="i-homework" viewBox="0 0 24 24">
          <path d="M5 5.2A2.2 2.2 0 0 1 7.2 3H19v16.5H7.2A2.2 2.2 0 0 0 5 21V5.2Z"/>
          <path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H19M9 7.5h6"/>
        </symbol>
        <symbol id="i-bring" viewBox="0 0 24 24">
          <path d="M8 8V6.5a4 4 0 0 1 8 0V8"/>
          <rect x="5" y="8" width="14" height="12" rx="3"/>
          <path d="M9 12h6M9.5 17.5h5"/>
        </symbol>
        <symbol id="i-health" viewBox="0 0 24 24">
          <path d="M20.8 8.8c0 4.6-8.8 9.6-8.8 9.6S3.2 13.4 3.2 8.8A4.5 4.5 0 0 1 12 6.5a4.5 4.5 0 0 1 8.8 2.3Z"/>
          <path d="M6.7 11.7h2.9l1.3-2.4 2 4.7 1.3-2.3h2.9"/>
        </symbol>
        <symbol id="i-other" viewBox="0 0 24 24">
          <path d="M4 10.5v3A1.5 1.5 0 0 0 5.5 15H8l7 4V5l-7 4H5.5A1.5 1.5 0 0 0 4 10.5Z"/>
          <path d="M8 15v3.2a1.6 1.6 0 0 0 3.2 0V16M18.8 9.2a4.2 4.2 0 0 1 0 5.6"/>
        </symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24">
          <path d="M4 13.5h4l1.5 2h5l1.5-2h4"/>
          <path d="M5.2 5h13.6L21 13.5v4A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-4L5.2 5Z"/>
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M12 7.8v5.4M12 16.6h.01"/>
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 16 16">
          <path d="m6 3.5 4.5 4.5L6 12.5"/>
        </symbol>
      </svg>

      <div class="notice-page">
        <section class="stats-card" aria-label="通知统计" data-od-id="notice-stats">
          <div class="stat">
            <span class="stat-number" id="stat-total">8</span>
            <span class="stat-skeleton" aria-hidden="true"></span>
            <span class="stat-label">全部通知</span>
          </div>
          <div class="stat stat--unread">
            <span class="stat-number" id="stat-unread">1</span>
            <span class="stat-skeleton" aria-hidden="true"></span>
            <span class="stat-label">未读</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="stat-today">1</span>
            <span class="stat-skeleton" aria-hidden="true"></span>
            <span class="stat-label">今日新增</span>
          </div>
        </section>

        <div class="filter-row" role="group" aria-label="按通知类型筛选" data-od-id="notice-filters">
          <button type="button" class="filter-pill" data-category="all" aria-pressed="true" data-od-id="filter-all">全部</button>
          <button type="button" class="filter-pill" data-category="task" aria-pressed="false" data-od-id="filter-task">任务</button>
          <button type="button" class="filter-pill" data-category="activity" aria-pressed="false" data-od-id="filter-activity">活动</button>
          <button type="button" class="filter-pill" data-category="notice" aria-pressed="false" data-od-id="filter-notice">通知</button>
        </div>

        <section class="notice-content" aria-label="通知列表" data-od-id="notice-content">
          <div class="notice-list" id="notice-list" data-od-id="notice-list">
            <button type="button" class="notice-card" data-read="false" data-category="activity" data-today="true" data-od-id="notice-autumn-games">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-activity"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">秋季亲子运动会报名通知</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                  <span class="sr-only unread-text">未读</span>
                </span>
                <span class="notice-preview">本周五上午 9:00 在大操场举行秋季亲子运动会，请填写回执交回班级。</span>
                <span class="notice-meta">活动 · 李老师 · 今天 08:30</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="task" data-od-id="notice-reading-checkin">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-task"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">周末亲子阅读打卡</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">本周亲子阅读主题是《好饿的毛毛虫》，请陪孩子读完后拍照上传。</span>
                <span class="notice-meta">任务 · 王老师 · 昨天 16:40</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="homework" data-od-id="notice-craft-home">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-homework"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">本周作业：手工《我的家》</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">请和孩子一起用废旧纸盒做一个小房子，下周一带来班级分享。</span>
                <span class="notice-meta">作业 · 王老师 · 昨天 15:10</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="health" data-od-id="notice-flu-season">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-health"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">流感季健康提示</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">近期昼夜温差大，请为孩子准备一件薄外套，如有发热请及时告知班级老师。</span>
                <span class="notice-meta">健康 · 保健室 张老师 · 10月24日</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="activity" data-od-id="notice-botanical-garden">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-activity"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">秋游通知：植物园半日行</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">10月28日上午前往市植物园，请为孩子准备水壶、遮阳帽和少量零食，穿园服。</span>
                <span class="notice-meta">活动 · 李老师 · 10月23日</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="bring" data-od-id="notice-spare-clothes">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bring"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">请带一套换洗衣物</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">天气转凉，请在小书包里放一套贴身换洗衣物，并写上孩子名字。</span>
                <span class="notice-meta">带物 · 王老师 · 10月22日</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="other" data-od-id="notice-health-checkup">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-other"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">秋季常规体检安排</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">10月29日上午进行秋季常规体检，体检当天请让孩子空腹，穿宽松衣物。</span>
                <span class="notice-meta">其他 · 园务办公室 · 10月21日</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>

            <button type="button" class="notice-card" data-read="true" data-category="task" data-od-id="notice-bedtime-backpack">
              <span class="notice-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-task"></use></svg>
              </span>
              <span class="notice-body">
                <span class="notice-heading">
                  <span class="notice-title">睡前整理小书包</span>
                  <span class="unread-dot" aria-hidden="true"></span>
                </span>
                <span class="notice-preview">请引导孩子自己整理书包：水壶、汗巾、绘本，完成后在任务里打卡。</span>
                <span class="notice-meta">任务 · 王老师 · 10月20日</span>
              </span>
              <span class="notice-arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron"></use></svg>
              </span>
            </button>
          </div>

          <div class="state-block filter-empty" id="filter-empty" hidden data-od-id="notice-filter-empty">
            <span class="state-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-inbox"></use></svg>
            </span>
            <h2 class="state-title">该分类暂无通知</h2>
            <button type="button" class="state-action state-action--ghost" id="view-all-btn">查看全部</button>
          </div>

          <div class="skeleton-list" id="skeleton-list" role="status" aria-label="正在加载通知">
            <div class="skeleton-card" aria-hidden="true">
              <span class="skeleton-icon"></span>
              <span class="skeleton-body">
                <span class="skeleton-line skeleton-line--title"></span>
                <span class="skeleton-line skeleton-line--wide"></span>
                <span class="skeleton-line skeleton-line--meta"></span>
              </span>
            </div>
            <div class="skeleton-card" aria-hidden="true">
              <span class="skeleton-icon"></span>
              <span class="skeleton-body">
                <span class="skeleton-line skeleton-line--title"></span>
                <span class="skeleton-line skeleton-line--wide"></span>
                <span class="skeleton-line skeleton-line--meta"></span>
              </span>
            </div>
            <div class="skeleton-card" aria-hidden="true">
              <span class="skeleton-icon"></span>
              <span class="skeleton-body">
                <span class="skeleton-line skeleton-line--title"></span>
                <span class="skeleton-line skeleton-line--wide"></span>
                <span class="skeleton-line skeleton-line--meta"></span>
              </span>
            </div>
          </div>

          <div class="state-block empty-state" id="empty-state" data-od-id="notice-empty">
            <span class="state-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-inbox"></use></svg>
            </span>
            <h2 class="state-title">暂无通知</h2>
            <p class="state-desc">老师发布通知后会出现在这里</p>
            <button type="button" class="state-action" id="empty-refresh-btn" data-od-id="notice-empty-refresh">刷新</button>
          </div>

          <div class="state-block error-state" id="error-state" data-od-id="notice-error">
            <span class="state-icon state-icon--danger" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-alert"></use></svg>
            </span>
            <h2 class="state-title">通知加载失败</h2>
            <p class="state-desc">下拉刷新或点击重试</p>
            <button type="button" class="state-action" id="retry-btn" data-od-id="notice-retry">重试</button>
          </div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="mp-demo" data-open="false">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" type="button" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" type="button" data-mp-state="empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" type="button" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" type="button" data-mp-state="error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>

  </div>
  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
