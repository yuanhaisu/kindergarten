<!doctype html>
<html lang="zh-CN" data-surface="parent">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>添加授权接送人 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2 5 6.1v5.1c0 4.2 2.9 7.8 7 9.4 4.1-1.6 7-5.2 7-9.4V6.1L12 3.2Z"/>
      <path d="m9.3 11.9 1.9 1.9 3.6-3.9"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.6 4.6L19 7.5"/>
    </symbol>
  </svg>

  <div class="mp-app" data-state="normal" data-od-id="auth-create-page">
    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <header class="mp-navbar">
      <button class="mp-back" type="button" aria-label="返回授权接送人" data-od-id="auth-back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <h1 class="mp-title">添加授权接送人</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main">
      <div class="page" data-od-id="auth-form-page">

        <div class="form-area" id="formArea">
          <div class="child-context" data-od-id="auth-child-context">
            <span class="child-avatar" aria-hidden="true">乐</span>
            <p class="child-text">为 <strong>乐乐</strong> 添加接送人</p>
          </div>

          <div class="section-head">
            <h2 class="section-title" id="basicHeading">基本信息</h2>
            <span class="section-rule" aria-hidden="true"></span>
            <span class="section-meta">3 项必填</span>
          </div>

          <section class="card form-card" aria-labelledby="basicHeading" data-od-id="auth-basic-card">
            <div class="field" id="fieldName" data-od-id="field-name">
              <label class="field-label" for="inputName">姓名<span class="req" aria-hidden="true">*</span></label>
              <input class="field-input" id="inputName" name="name" type="text" autocomplete="name" maxlength="20" placeholder="请输入姓名" value="王建国" aria-required="true" aria-describedby="nameError">
              <p class="field-error" id="nameError" hidden>请填写姓名</p>
            </div>

            <div class="field" id="fieldPhone" data-od-id="field-phone">
              <label class="field-label" for="inputPhone">手机号<span class="req" aria-hidden="true">*</span></label>
              <input class="field-input" id="inputPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" value="13812345678" aria-required="true" aria-describedby="phoneError">
              <p class="field-error" id="phoneError" hidden>请填写 11 位手机号</p>
            </div>

            <div class="field" id="fieldRelation" data-od-id="field-relation">
              <span class="field-label" id="relationLabel">与孩子关系<span class="req" aria-hidden="true">*</span></span>
              <button class="relation-row" type="button" id="relationBtn" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="relationLabel relationValue">
                <span class="relation-value" id="relationValue">爷爷</span>
                <svg class="relation-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
              </button>
            </div>

            <div class="field" id="fieldIdcard" data-od-id="field-idcard">
              <div class="field-label-row">
                <label class="field-label" for="inputId">身份证号</label>
                <span class="field-optional">选填</span>
              </div>
              <input class="field-input" id="inputId" name="id_card_number" type="text" inputmode="text" autocomplete="off" maxlength="18" placeholder="选填，便于门卫核验" value="310101195503124012">
            </div>
          </section>

          <div class="section-head">
            <h2 class="section-title" id="permHeading">权限设置</h2>
            <span class="section-rule" aria-hidden="true"></span>
            <span class="section-meta">按需开启</span>
          </div>

          <section class="card perm-card" aria-labelledby="permHeading" data-od-id="auth-perm-card">
            <button class="perm-row" type="button" role="switch" aria-checked="true" data-perm="allow_pickup" aria-labelledby="permPickupLabel" aria-describedby="permPickupDesc" data-od-id="perm-allow-pickup">
              <span class="perm-copy">
                <span class="perm-label" id="permPickupLabel">可接送孩子</span>
                <span class="perm-sub" id="permPickupDesc">允许门卫核验身份后接走孩子</span>
              </span>
              <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
            </button>

            <button class="perm-row" type="button" role="switch" aria-checked="false" data-perm="allow_view_record" aria-labelledby="permRecordLabel" aria-describedby="permRecordDesc" data-od-id="perm-allow-view-record">
              <span class="perm-copy">
                <span class="perm-label" id="permRecordLabel">可查看接送记录</span>
                <span class="perm-sub" id="permRecordDesc">查看孩子每次被接走的时间</span>
              </span>
              <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
            </button>

            <button class="perm-row" type="button" role="switch" aria-checked="false" data-perm="allow_view_status" aria-labelledby="permStatusLabel" aria-describedby="permStatusDesc" data-od-id="perm-allow-view-status">
              <span class="perm-copy">
                <span class="perm-label" id="permStatusLabel">可查看在园状态</span>
                <span class="perm-sub" id="permStatusDesc">查看孩子此刻是否在园</span>
              </span>
              <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
            </button>

            <button class="perm-row" type="button" role="switch" aria-checked="false" data-perm="allow_growth_view" aria-labelledby="permGrowthLabel" aria-describedby="permGrowthDesc" data-od-id="perm-allow-growth-view">
              <span class="perm-copy">
                <span class="perm-label" id="permGrowthLabel">可查看成长记录</span>
                <span class="perm-sub" id="permGrowthDesc">查看老师发布的成长记录</span>
              </span>
              <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
            </button>

            <button class="perm-row" type="button" role="switch" aria-checked="true" data-perm="notify_on_pickup" aria-labelledby="permNotifyLabel" aria-describedby="permNotifyDesc" data-od-id="perm-notify-on-pickup">
              <span class="perm-copy">
                <span class="perm-label" id="permNotifyLabel">接送时通知我</span>
                <span class="perm-sub" id="permNotifyDesc">孩子被接走时通知本账号</span>
              </span>
              <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
            </button>
          </section>

          <div class="notice" role="note" data-od-id="auth-review-note">
            <svg class="notice-icon" width="16" height="16" aria-hidden="true"><use href="#icon-shield"></use></svg>
            <p class="notice-text">提交后需园所审核通过，授权才会生效。审核通过前，该接送人不能接走孩子。</p>
          </div>
        </div>

        <div class="skeleton-area" id="skeletonArea" aria-hidden="true">
          <div class="sk-context">
            <span class="sk sk-avatar"></span>
            <span class="sk sk-context-line"></span>
          </div>
          <div class="sk-card">
            <span class="sk sk-input"></span>
            <span class="sk sk-input"></span>
            <span class="sk sk-input"></span>
          </div>
          <div class="sk-card">
            <span class="sk sk-row"></span>
            <span class="sk sk-row"></span>
            <span class="sk sk-row"></span>
          </div>
        </div>

      </div>
    </main>

    <div class="submit-bar" data-od-id="auth-submit-bar">
      <div class="fail-bar" id="failBar" role="alert">
        <span class="fail-text">提交失败，请重试</span>
        <button class="fail-retry" type="button" id="retryBtn" data-od-id="auth-retry">重试</button>
      </div>
      <p class="submit-note" id="submitNote" aria-live="polite">提交后需园所审核，通过后才可接送</p>
      <button class="submit-btn" type="button" id="submitBtn" aria-disabled="false" data-od-id="auth-submit-btn">
        <span class="btn-label">提交</span>
        <span class="btn-busy" aria-hidden="true"><span class="btn-spinner"></span>提交中…</span>
      </button>
    </div>

    <div class="sheet-layer" id="sheetLayer" hidden data-od-id="auth-relation-sheet">
      <button class="sheet-scrim" type="button" id="sheetScrim" aria-label="关闭关系选择" tabindex="-1"></button>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetPanel">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 class="sheet-title" id="sheetTitle">与孩子关系</h2>
        <div class="sheet-options" id="sheetOptions" role="listbox" aria-labelledby="sheetTitle">
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="爸爸">爸爸<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="妈妈">妈妈<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option is-selected" type="button" role="option" aria-selected="true" data-value="爷爷">爷爷<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="奶奶">奶奶<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="外公">外公<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="外婆">外婆<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="叔叔">叔叔<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="阿姨">阿姨<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
          <button class="sheet-option" type="button" role="option" aria-selected="false" data-value="其他">其他<svg class="sheet-check" width="18" height="18" aria-hidden="true"><use href="#icon-check"></use></svg></button>
        </div>
        <button class="sheet-cancel" type="button" id="sheetCancel">取消</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="mp-demo" data-open="false" style="bottom: calc(112px + env(safe-area-inset-bottom))">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" data-mp-state="empty" aria-pressed="false">必填未完成</button>
        <button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" data-mp-state="submitting" aria-pressed="false">提交中</button>
        <button class="mp-demo-chip" data-mp-state="failed" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
    </div>
  </div>

  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
