<!doctype html>
<html lang="zh-CN" data-surface="parent">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-task" viewBox="0 0 24 24">
      <rect x="5" y="4.5" width="14" height="16.5" rx="3"></rect>
      <path d="M9.2 4.5V3.8c0-.9.7-1.6 1.6-1.6h2.4c.9 0 1.6.7 1.6 1.6v.7"></path>
      <path d="m8.6 12.2 2.1 2.1 4.4-4.4"></path>
    </symbol>
    <symbol id="i-points" viewBox="0 0 24 24">
      <path d="m12 3.4 2.6 5.2 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8L12 3.4Z"></path>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="4" y="5.5" width="16" height="15" rx="2.5"></rect>
      <path d="M8 3.5v4M16 3.5v4M4 10h16"></path>
      <path d="M8.5 13.8h.1M12 13.8h.1M15.5 13.8h.1M8.5 17h.1M12 17h.1"></path>
    </symbol>
    <symbol id="i-report" viewBox="0 0 24 24">
      <path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"></path>
      <path d="M14 3.8V8h3.8"></path>
      <path d="m8.2 16.5 2.1-2.3 2 1.7 3.5-4.1"></path>
    </symbol>
    <symbol id="i-leave" viewBox="0 0 24 24">
      <rect x="4" y="5.5" width="16" height="15" rx="2.5"></rect>
      <path d="M8 3.5v4M16 3.5v4M4 10h16M8.5 15.5h7"></path>
    </symbol>
    <symbol id="i-pickup" viewBox="0 0 24 24">
      <rect x="4" y="4.5" width="16" height="12.5" rx="3"></rect>
      <path d="M4 10.5h16M8 17v2M16 17v2"></path>
      <circle cx="8" cy="14" r=".8" fill="currentColor" stroke="none"></circle>
      <circle cx="16" cy="14" r=".8" fill="currentColor" stroke="none"></circle>
    </symbol>
    <symbol id="i-auth" viewBox="0 0 24 24">
      <circle cx="9.5" cy="8" r="3.2"></circle>
      <path d="M3.8 20c0-3.1 2.5-5.4 5.7-5.4 1.2 0 2.3.3 3.2.9"></path>
      <path d="m15.5 18.5 1.7 1.7 3.3-4"></path>
    </symbol>
    <symbol id="i-child" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M9 10.2v.2M15 10.2v.2"></path>
      <path d="M8.8 14.2c.8 1.3 1.9 2 3.2 2s2.4-.7 3.2-2"></path>
      <path d="M9.2 4.1c.7-.7 1.9-.8 2.8-.2.9-.6 2.1-.5 2.8.2"></path>
    </symbol>
    <symbol id="i-class" viewBox="0 0 24 24">
      <path d="M4 20V9.5l8-4 8 4V20M4 20h16"></path>
      <path d="M9 20v-5h6v5M8 11.5h.1M12 11.5h.1M16 11.5h.1"></path>
    </symbol>
    <symbol id="i-notice" viewBox="0 0 24 24">
      <path d="M6.2 16.5h11.6l-1.1-1.8V10a4.7 4.7 0 0 0-9.4 0v4.7l-1.1 1.8Z"></path>
      <path d="M10 19a2.2 2.2 0 0 0 4 0"></path>
    </symbol>
    <symbol id="i-feedback" viewBox="0 0 24 24">
      <path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4.5 3v-12Z"></path>
      <path d="M8.5 9.5h7M8.5 12.5h4.5"></path>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M4 7h6.5M16.5 7H20M4 17h4M14 17h6"></path>
      <circle cx="13" cy="7" r="2.2"></circle>
      <circle cx="10.5" cy="17" r="2.2"></circle>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m9.5 6 6 6-6 6"></path>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.4"></circle>
      <path d="M4.8 20c.7-3.5 3.4-5.6 7.2-5.6s6.5 2.1 7.2 5.6"></path>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M12 7.5v5.2M12 16.2v.2"></path>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="m3.8 10.8 8.2-7 8.2 7"></path>
      <path d="M5.5 9.3V20h13V9.3"></path>
      <path d="M9.5 20v-5.5h5V20"></path>
    </symbol>
    <symbol id="i-growth" viewBox="0 0 24 24">
      <path d="M12 20v-7"></path>
      <path d="M12 13c0-3.3-2.6-5.3-6.2-5.3C5.8 11.3 8 13 12 13Z"></path>
      <path d="M12 10.5c.2-2.8 2.3-4.5 5.8-4.5-.2 3.1-2.2 4.8-5.8 4.8Z"></path>
    </symbol>
  </svg>

  <div class="mp-app" id="app" data-state="normal" data-od-id="parent-profile">
    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"/><path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/><path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"/><path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <header class="mp-navbar">
      <h1 class="mp-title" data-od-id="profile-title">我的</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">···</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main">
      <div class="profile-page" id="profilePage" data-state="normal">
        <p class="sr-only" id="stateAnnouncer" role="status" aria-live="polite"></p>

        <section class="identity-stage" aria-label="家长账号">
          <article class="identity-card identity-pane identity-pane--user" data-od-id="profile-identity" tabindex="-1">
            <div class="identity-orbit" aria-hidden="true">
              <span class="orbit-ring orbit-ring--outer"></span>
              <span class="orbit-ring orbit-ring--inner"></span>
            </div>
            <div class="identity-avatar" aria-hidden="true">乐</div>
            <div class="identity-body">
              <div class="identity-name-row">
                <h2 class="identity-name">乐乐妈妈</h2>
                <span class="identity-role">家长</span>
              </div>
              <p class="identity-meta">
                <span class="identity-meta-line">
                  <span class="identity-phone">138****6688</span>
                  <span class="meta-sep" aria-hidden="true">·</span>
                </span>
                <span class="identity-school">阳光幼儿园</span>
              </p>
            </div>
          </article>

          <div class="identity-card identity-pane identity-pane--empty identity-state" data-od-id="profile-identity-empty">
            <span class="state-badge state-badge--warm" aria-hidden="true">
              <svg class="icon" width="18" height="18"><use href="#i-user"></use></svg>
            </span>
            <div class="state-copy">
              <p class="state-title">还没有读取到家长信息</p>
            </div>
            <button class="btn btn--primary btn--state" id="reloginButton" type="button" data-od-id="relogin-button">重新登录</button>
          </div>

          <div class="identity-card identity-pane identity-pane--loading identity-skeleton" role="status" aria-label="正在加载家长信息" data-od-id="profile-identity-loading">
            <span class="skeleton skeleton-avatar" aria-hidden="true"></span>
            <span class="skeleton-copy" aria-hidden="true">
              <span class="skeleton skeleton-line skeleton-line--name"></span>
              <span class="skeleton skeleton-line skeleton-line--meta"></span>
            </span>
          </div>

          <div class="identity-card identity-pane identity-pane--error identity-state" data-od-id="profile-identity-error">
            <span class="state-badge state-badge--danger" aria-hidden="true">
              <svg class="icon" width="18" height="18"><use href="#i-alert"></use></svg>
            </span>
            <div class="state-copy">
              <p class="state-title">账号信息加载失败</p>
              <p class="state-desc">网络开小差了，请稍后重试</p>
            </div>
            <button class="btn btn--ghost btn--state" id="retryButton" type="button" aria-busy="false" data-od-id="retry-button">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span id="retryLabel">重试</span>
            </button>
          </div>
        </section>

        <div class="menu-groups" data-od-id="profile-menu">
          <section class="menu-group" aria-labelledby="group-growth-title">
            <h2 class="group-title" id="group-growth-title" data-od-id="group-growth-title">成长与任务</h2>
            <div class="menu-card">
              <button class="menu-row" type="button" data-menu-title="亲子任务" data-od-id="menu-tasks">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-task"></use></svg></span>
                <span class="menu-label">亲子任务</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="积分成就" data-od-id="menu-points">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-points"></use></svg></span>
                <span class="menu-label">积分成就</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="班级日历" data-od-id="menu-calendar">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-calendar"></use></svg></span>
                <span class="menu-label">班级日历</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="成长报告" data-od-id="menu-growth-report">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-report"></use></svg></span>
                <span class="menu-label">成长报告</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
            </div>
          </section>

          <section class="menu-group" aria-labelledby="group-daily-title">
            <h2 class="group-title" id="group-daily-title" data-od-id="group-daily-title">在园日常</h2>
            <div class="menu-card">
              <button class="menu-row" type="button" data-menu-title="请假记录" data-od-id="menu-leave">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-leave"></use></svg></span>
                <span class="menu-label">请假记录</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="接送记录" data-od-id="menu-pickup">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-pickup"></use></svg></span>
                <span class="menu-label">接送记录</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="授权人管理" data-od-id="menu-authorized">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-auth"></use></svg></span>
                <span class="menu-label">授权人管理</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
            </div>
          </section>

          <section class="menu-group" aria-labelledby="group-child-title">
            <h2 class="group-title" id="group-child-title" data-od-id="group-child-title">孩子与班级</h2>
            <div class="menu-card">
              <button class="menu-row" type="button" data-menu-title="我的孩子" data-od-id="menu-child">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-child"></use></svg></span>
                <span class="menu-label">我的孩子</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="班级信息" data-od-id="menu-class">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-class"></use></svg></span>
                <span class="menu-label">班级信息</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
            </div>
          </section>

          <section class="menu-group" aria-labelledby="group-settings-title">
            <h2 class="group-title" id="group-settings-title" data-od-id="group-settings-title">消息与设置</h2>
            <div class="menu-card">
              <button class="menu-row" type="button" data-menu-title="通知公告" data-od-id="menu-notice">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-notice"></use></svg></span>
                <span class="menu-label">通知公告</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="意见反馈" data-od-id="menu-feedback">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-feedback"></use></svg></span>
                <span class="menu-label">意见反馈</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
              <button class="menu-row" type="button" data-menu-title="设置" data-od-id="menu-settings">
                <span class="menu-icon" aria-hidden="true"><svg class="icon" width="18" height="18"><use href="#i-settings"></use></svg></span>
                <span class="menu-label">设置</span>
                <svg class="icon menu-chevron" width="16" height="16" aria-hidden="true"><use href="#i-chevron"></use></svg>
              </button>
            </div>
          </section>
        </div>

        <div class="loading-menu" data-od-id="profile-menu-loading">
          <p class="sr-only">菜单加载中</p>
          <div class="loading-card" aria-hidden="true">
            <div class="loading-row">
              <span class="skeleton skeleton-tile"></span>
              <span class="skeleton skeleton-line skeleton-line--menu"></span>
              <span class="skeleton skeleton-chevron"></span>
            </div>
            <div class="loading-row">
              <span class="skeleton skeleton-tile"></span>
              <span class="skeleton skeleton-line skeleton-line--menu skeleton-line--menu-short"></span>
              <span class="skeleton skeleton-chevron"></span>
            </div>
            <div class="loading-row">
              <span class="skeleton skeleton-tile"></span>
              <span class="skeleton skeleton-line skeleton-line--menu"></span>
              <span class="skeleton skeleton-chevron"></span>
            </div>
          </div>
        </div>

        <button class="logout-button" id="logoutButton" type="button" data-od-id="logout-button">退出登录</button>
        <footer class="profile-footer">养成星球 · 家长端</footer>
      </div>
    </main>

    <nav class="mp-tabbar profile-tabbar" aria-label="主导航">
      <button class="mp-tab" type="button" data-tab-title="首页" data-od-id="tab-home">
        <svg class="icon" width="22" height="22" aria-hidden="true"><use href="#i-home"></use></svg>
        <span>首页</span>
      </button>
      <button class="mp-tab" type="button" data-tab-title="成长" data-od-id="tab-growth">
        <svg class="icon" width="22" height="22" aria-hidden="true"><use href="#i-growth"></use></svg>
        <span>成长</span>
      </button>
      <button class="mp-tab" type="button" data-tab-title="接送" data-od-id="tab-pickup">
        <svg class="icon" width="22" height="22" aria-hidden="true"><use href="#i-pickup"></use></svg>
        <span>接送</span>
      </button>
      <button class="mp-tab" type="button" aria-current="page" data-tab-title="我的" data-od-id="tab-profile">
        <svg class="icon" width="22" height="22" aria-hidden="true"><use href="#i-user"></use></svg>
        <span>我的</span>
      </button>
    </nav>

    <div class="mp-demo" id="demoPanel" data-open="false" style="bottom: calc(62px + env(safe-area-inset-bottom))">
      <div class="mp-demo-chips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" type="button" data-mp-state="normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" type="button" data-mp-state="empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" type="button" data-mp-state="loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" type="button" data-mp-state="error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false" aria-controls="demoPanel">原型演示</button>
    </div>

    <div class="dialog-layer" id="logoutDialog" hidden>
      <div class="dialog-backdrop" aria-hidden="true"></div>
      <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="logoutDialogTitle" aria-describedby="logoutDialogDesc">
        <div class="dialog-copy">
          <h2 class="dialog-title" id="logoutDialogTitle">退出登录</h2>
          <p class="dialog-message" id="logoutDialogDesc">退出后需重新微信登录，确定退出吗？</p>
        </div>
        <div class="dialog-actions">
          <button class="dialog-action dialog-cancel" id="logoutCancel" type="button">取消</button>
          <button class="dialog-action dialog-confirm" id="logoutConfirm" type="button">退出登录</button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
