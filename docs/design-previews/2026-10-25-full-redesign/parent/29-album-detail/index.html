<head>

<body>

</div>
<header class="mp-navbar">
<button class="mp-back" id="backButton" type="button" aria-label="返回班级相册">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
</button>
<h1 class="mp-title">相册详情</h1>
<div class="mp-capsule" aria-hidden="true">
<span class="mp-capsule-dots">···</span>
<span class="mp-capsule-divider"></span>
<span class="mp-capsule-ring">◎</span>
</div>
</header>

<main class="mp-main">
<div class="page">

<!-- 正常态 -->
<section class="album-body" aria-label="相册内容">
<header class="album-head">
<h2 class="head-title">秋日郊游</h2>
<div class="head-meta">
<span class="head-date">10月24日</span>
<span class="tag">户外活动</span>
<span class="head-count">共 32 张</span>
</div>
</header>

<div class="photo-grid" aria-label="照片">
<button class="photo-tile tile-1" type="button" aria-label="查看第 1 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="m3.5 18 5-5 3.4 3.4 3.2-3.2L20.5 18Z"/></svg></button>
<button class="photo-tile tile-2" type="button" aria-label="查看第 2 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 20c4.4 0 8-3.6 8-8 0-4.4-3.6-7-8-9-4.4 2-8 4.6-8 9 0 4.4 3.6 8 8 8Z"/><path d="M12 8v8"/></svg></button>
<button class="photo-tile tile-3" type="button" aria-label="查看第 3 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3.5 14.7 9l6 .7-4.5 4.1 1.3 6L12 16.9l-5.5 2.9 1.3-6L3.3 9.7l6-.7Z"/></svg></button>
<button class="photo-tile tile-4" type="button" aria-label="查看第 4 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 17c2-4 4-6 8-6s6 2 8 6"/><circle cx="12" cy="7" r="3"/></svg></button>
<button class="photo-tile tile-5" type="button" aria-label="查看第 5 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 19c0-6 3-10 7-14 4 4 7 8 7 14"/><path d="M9 19c0-4 1.4-6.6 3-9 1.6 2.4 3 5 3 9"/></svg></button>
<button class="photo-tile tile-6" type="button" aria-label="查看第 6 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5h16v13H4Z"/><path d="M8 6.5V4h8v2.5"/><path d="M8 12h8"/></svg></button>
<button class="photo-tile tile-7" type="button" aria-label="查看第 7 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 20c4.4 0 8-3.6 8-8 0-4.4-3.6-7-8-9-4.4 2-8 4.6-8 9 0 4.4 3.6 8 8 8Z"/><path d="M12 8v8"/></svg></button>
<button class="photo-tile tile-8" type="button" aria-label="查看第 8 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="m3.5 18 5-5 3.4 3.4 3.2-3.2L20.5 18Z"/></svg></button>
<button class="photo-tile tile-9" type="button" aria-label="查看第 9 张照片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3.5 14.7 9l6 .7-4.5 4.1 1.3 6L12 16.9l-5.5 2.9 1.3-6L3.3 9.7l6-.7Z"/></svg></button>
</div>
<p class="page-note">点开照片可保存原图</p>
</section>

<!-- 加载态 -->
<section class="skeleton" aria-hidden="true">
<div class="sk-head">
<span class="sk sk-line sk-line--title"></span>
<span class="sk sk-line sk-line--meta"></span>
</div>
<div class="sk-grid">
<span class="sk sk-photo"></span><span class="sk sk-photo"></span><span class="sk sk-photo"></span>
<span class="sk sk-photo"></span><span class="sk sk-photo"></span><span class="sk sk-photo"></span>
<span class="sk sk-photo"></span><span class="sk sk-photo"></span><span class="sk sk-photo"></span>
</div>
</section>

<!-- 空态 -->
<section class="empty-state">
<div class="empty-art"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.4-4.2 3.4 3.2 2.4-2.4L19 17"/></svg></div>
<p class="empty-title">这本相册里暂时没有孩子的照片</p>
<p class="empty-desc">老师发布新照片后会出现在这里</p>
<button class="link-btn" type="button">看看其它相册</button>
</section>

<!-- 失败态 -->
<section class="error-state">
<div class="error-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3.5 21 20H3Z"/><path d="M12 9v5"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg></div>
<p class="error-title">相册无法查看</p>
<p class="error-desc">网络不太稳定，请稍后再试</p>
<div class="error-actions">
<button class="state-action" type="button"><span class="state-action-text">重试</span></button>
<button class="state-action state-action--ghost" type="button"><span class="state-action-text">返回相册列表</span></button>
</div>
</section>

</div>
</main>

<div class="mp-demo" data-open="false">
<div class="mp-demo-chips" role="group" aria-label="原型状态">
<button class="mp-demo-chip" data-mp-state="normal" aria-pressed="true">正常</button>
<button class="mp-demo-chip" data-mp-state="empty" aria-pressed="false">空态</button>
<button class="mp-demo-chip" data-mp-state="loading" aria-pressed="false">加载</button>
<button class="mp-demo-chip" data-mp-state="error" aria-pressed="false">失败</button>
</div>
<button class="mp-demo-toggle" type="button" aria-expanded="false">原型演示</button>
</div>

</div>
<script src="../../_shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
