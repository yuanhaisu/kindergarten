<!doctype html>
<html lang="zh-CN" data-surface="parent">
<head>
  <script src="../../_shared/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>家长登录 · 养成星球</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="../../_shared/shell.css">
  <link rel="stylesheet" href="../../_shared/themes.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mp-app" data-state="normal" data-od-id="parent-login-page">

    <div class="mp-statusbar" aria-hidden="true">
      <span class="mp-time">9:41</span>
      <span class="mp-status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
          <rect x="0" y="7" width="3" height="4" rx="1"></rect>
          <rect x="4.5" y="5" width="3" height="6" rx="1"></rect>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1"></rect>
          <rect x="13.5" y="0" width="3" height="11" rx="1"></rect>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M1 3.6C2.8 2 5.3 1 7.5 1s4.7 1 6.5 2.6"></path>
          <path d="M3.5 6.1c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"></path>
          <path d="M6 8.6c.5-.4 1-.6 1.5-.6s1 .2 1.5.6"></path>
          <circle cx="7.5" cy="10" r=".7" fill="currentColor"></circle>
        </svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none">
          <rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"></rect>
          <rect x="2" y="2" width="15" height="7" rx="1.8" fill="currentColor"></rect>
          <path d="M22 3.5v4c.9-.3 1.4-1 1.4-2s-.5-1.7-1.4-2Z" fill="currentColor" fill-opacity=".5"></path>
        </svg>
      </span>
    </div>

    <header class="mp-navbar">
      <h1 class="mp-title">家长登录</h1>
      <div class="mp-capsule" aria-hidden="true">
        <span class="mp-capsule-dots">•••</span>
        <span class="mp-capsule-divider"></span>
        <span class="mp-capsule-ring">◎</span>
      </div>
    </header>

    <main class="mp-main">
      <div class="login-page">

        <div class="brand" data-od-id="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <svg class="brand-orbit" viewBox="0 0 72 72" fill="none" focusable="false">
              <ellipse cx="36" cy="36" rx="32" ry="11.5" transform="rotate(-24 36 36)" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1 4" stroke-linecap="round"></ellipse>
              <circle class="brand-satellite" cx="47.5" cy="20.2" r="2.3"></circle>
            </svg>
            <span class="brand-core"></span>
          </div>
          <p class="brand-name">养成星球</p>
          <p class="brand-sub">幼儿园数字化管理平台</p>
        </div>

        <section class="login-card" aria-label="家长微信登录" data-od-id="login-card">
          <div class="error-bar" id="loginError" role="alert" aria-live="assertive" data-od-id="login-error">
            <span class="error-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="9" cy="9" r="7.2"></circle>
                <path d="M9 5.2v4.4" stroke-linecap="round"></path>
                <circle cx="9" cy="12.4" r=".85" fill="currentColor" stroke="none"></circle>
              </svg>
            </span>
            <div class="error-copy">
              <p class="error-title" id="errorTitle">微信登录失败</p>
              <p class="error-desc" id="errorDesc">请稍后重试</p>
            </div>
          </div>

          <button class="login-btn" id="loginBtn" type="button" data-od-id="wechat-login">
            <span class="btn-spinner" aria-hidden="true"></span>
            <svg class="btn-wechat" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12.4 4.4c-4.1 0-7.4 2.7-7.4 6 0 1.9 1.1 3.6 2.8 4.7l-.8 2.5 2.9-1.5c.8.2 1.6.3 2.5.3 4.1 0 7.4-2.7 7.4-6s-3.3-6-7.4-6Z" fill="none" stroke="var(--on-brand)" stroke-width="1.6" stroke-linejoin="round"></path>
              <circle cx="9.9" cy="10.2" r="1.15" fill="var(--on-brand)"></circle>
              <circle cx="14.9" cy="10.2" r="1.15" fill="var(--on-brand)"></circle>
            </svg>
            <span class="btn-label btn-label--idle">微信一键登录</span>
            <span class="btn-label btn-label--loading">登录中...</span>
            <span class="btn-label btn-label--retry">重新登录</span>
          </button>

          <label class="agree" id="agreeRow" data-od-id="agreement-row">
            <input class="agree-input" id="agreeInput" type="checkbox" name="agreement" checked data-od-id="agreement-checkbox">
            <span class="agree-box" aria-hidden="true">
              <svg class="agree-check" width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2.2 6.3 4.7 8.8 9.8 3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
            <span class="agree-text">我已阅读并同意《用户协议》和《隐私政策》</span>
          </label>
        </section>

        <p class="login-note" data-od-id="login-footnote">登录后需绑定园所已开通的家长账号</p>
      </div>
    </main>

    <div class="toast" id="loginToast" data-tone="warning" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="toast-icon" aria-hidden="true">
        <svg class="toast-glyph toast-glyph--warning" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="9" r="7.2"></circle>
          <path d="M9 8.2v4.2" stroke-linecap="round"></path>
          <circle cx="9" cy="5.4" r=".85" fill="currentColor" stroke="none"></circle>
        </svg>
        <svg class="toast-glyph toast-glyph--success" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="9" r="7.2"></circle>
          <path d="m5.5 9.1 2.3 2.3 4.7-4.9" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <svg class="toast-glyph toast-glyph--danger" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="9" cy="9" r="7.2"></circle>
          <path d="m6.5 6.5 5 5M11.5 6.5l-5 5" stroke-linecap="round"></path>
        </svg>
      </span>
      <span class="toast-text" id="toastText"></span>
    </div>

    <div class="mp-demo" data-open="false" id="demoPanel" data-od-id="prototype-demo" style="bottom: calc(18px + env(safe-area-inset-bottom))">
      <div class="mp-demo-chips" id="demoChips" role="group" aria-label="原型状态">
        <button class="mp-demo-chip" type="button" data-mp-state="normal" data-od-id="demo-normal" aria-pressed="true">正常</button>
        <button class="mp-demo-chip" type="button" data-mp-state="empty" data-od-id="demo-empty" aria-pressed="false">空态</button>
        <button class="mp-demo-chip" type="button" data-mp-state="loading" data-od-id="demo-loading" aria-pressed="false">加载</button>
        <button class="mp-demo-chip" type="button" data-mp-state="error" data-od-id="demo-error" aria-pressed="false">失败</button>
      </div>
      <button class="mp-demo-toggle" type="button" aria-expanded="false" aria-controls="demoChips">原型演示</button>
    </div>

  </div>

  <script src="../../_shared/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
