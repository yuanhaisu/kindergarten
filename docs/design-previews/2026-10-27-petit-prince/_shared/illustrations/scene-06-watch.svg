    <path d="M400 500 q3 -5 0 -9 q-3 4 0 9 Z" fill="#C0392B" stroke="none"/>
    <line x1="400" y1="488" x2="400" y2="483" stroke-width="1"/>
    <line x1="391" y1="495" x2="387" y2="493" stroke-width="1"/>
