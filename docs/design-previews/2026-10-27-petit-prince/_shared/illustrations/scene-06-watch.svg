  <!-- 惊喜元素：铃铛（变体 B，平放地面；朱砂点改墨色） -->
  <g transform="translate(478 565)" fill="none" stroke="#141414">
    <path d="M15,4 Q15,0 30,0 Q45,0 45,4 L48,30 Q48,36 30,36 Q12,36 12,30 Z" stroke-width="1.8"/>
    <circle cx="30" cy="24" r="3" stroke-width="1.2"/>
    <line x1="30" y1="30" x2="30" y2="36" stroke-width="1"/>
    <circle cx="30" cy="0" r="5" stroke-width="1.4"/>
