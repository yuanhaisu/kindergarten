  <text id="title" x="300" y="695" text-anchor="middle" font-size="40" fill="#141414" letter-spacing="6">值 守</text>
  <line x1="260" y1="715" x2="340" y2="715" stroke="#141414" stroke-width="1.4"/>
  <text id="quote" x="300" y="745" text-anchor="middle" font-size="16" fill="#141414" letter-spacing="3">到点就点灯</text>
  <text x="300" y="770" text-anchor="middle" font-size="12" fill="#666666" letter-spacing="1">节律让人安心</text>

  <rect x="16" y="16" width="568" height="768" fill="none" stroke="#141414" stroke-width="1.2" opacity=".2"/>
